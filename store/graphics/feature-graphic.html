<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1024px;height:500px;overflow:hidden;font-family:"Noto Sans KR","Noto Sans",system-ui,sans-serif;background:#0D1B3A;position:relative;color:#fff}
.photo{position:absolute;inset:0;background:url(../../assets/images/hero-hill.jpg) center/cover;opacity:.55}
.shade{position:absolute;inset:0;background:linear-gradient(100deg,#0D1B3A 8%,rgba(13,27,58,.92) 40%,rgba(13,27,58,.35) 100%)}
.glow{position:absolute;right:-80px;bottom:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(242,103,34,.55),rgba(242,103,34,0) 70%)}
.c{position:relative;padding:74px 70px}
.logo{height:92px;display:block;margin-bottom:34px}
h1{font-size:64px;font-weight:900;letter-spacing:-.035em;line-height:1.05}
p{margin-top:22px;font-size:27px;font-weight:500;color:#FFD9C4;letter-spacing:-.01em}
.bar{width:84px;height:6px;border-radius:3px;background:#F26722;margin-top:26px}
</style>
<div class="photo"></div><div class="shade"></div><div class="glow"></div>
<div class="c"><img class="logo" src="../../assets/SVM_Logo_white.svg">
<h1>SVM Mission</h1><div class="bar"></div><p>Train. Pray. Go. Report back.</p></div>
