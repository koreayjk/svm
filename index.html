<style>
  /* ---------- Brand tokens (명세 v2 §2) ---------- */
  :root {
    --navy: #0D1B3A;
    --navy-2: #1B2C55;
    --orange: #F26722;
    --orange-dark: #C4501A;
    --orange-soft: #FEEFE6;
    --bg: #F4F5F8;
    --card: #FFFFFF;
    --text: #0D1B3A;
    --muted: #4A5568;
    --muted-2: #5B6475;
    --line: #DDE2EA;
    --danger: #B42318;
    --danger-soft: #FEF0EE;
    --ok: #157F4F;
    --radius: 18px;
    --tabbar-h: 66px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --font: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
    --font-label: "Barlow Condensed", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.55;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--orange-dark); }
  .hidden { display: none !important; }

  /* ---------- Type ---------- */
  h1 { font-size: 26px; font-weight: 900; line-height: 1.25; margin: 4px 0 12px; letter-spacing: -.3px; }
  h2 { font-size: 19px; font-weight: 900; margin: 22px 0 10px; letter-spacing: -.2px; }
  h3 { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13.5px; }
  .eyebrow {
    font-family: var(--font-label); font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 1.2px; color: var(--orange-dark);
  }
  .num { font-family: var(--font-label); font-weight: 700; }
  .tagline { font-family: var(--font-label); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  }
  .topbar-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .topbar .logo { height: 30px; width: auto; display: block; }
  .lang-toggle { display: inline-flex; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; overflow: hidden; }
  .lang-toggle button {
    background: transparent; border: 0; color: #fff; padding: 5px 11px; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  .lang-toggle button.active { background: #fff; color: var(--navy); font-weight: 700; }
  .lang-toggle.dark { border-color: var(--line); background: #fff; }
  .lang-toggle.dark button { color: var(--muted); }
  .lang-toggle.dark button.active { background: var(--navy); color: #fff; }

  /* ---------- Layout ---------- */
  main { max-width: 640px; margin: 0 auto; padding: 18px 16px calc(var(--tabbar-h) + var(--safe-b) + 28px); }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 12px;
    border: 1px solid var(--line);
  }
  .card.dark { background: var(--navy); color: #fff; border-color: var(--navy); }
  .card.dark .muted { color: rgba(255,255,255,.72); }
  .card.dark .eyebrow { color: var(--orange); }
  .card.soon { background: transparent; border-style: dashed; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }
  .stack > * + * { margin-top: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }
  .divider { border: 0; border-top: 1px solid rgba(255,255,255,.15); margin: 14px 0; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700; background: var(--bg); color: var(--muted); white-space: nowrap;
  }
  .badge.member { background: #E9EDF5; color: var(--navy); }
  .badge.graduate { background: var(--orange-soft); color: var(--orange-dark); }
  .badge.admin { background: var(--navy); color: #fff; }
  .badge.sensitive { background: var(--danger-soft); color: var(--danger); }
  .badge.soon { font-family: var(--font-label); letter-spacing: .6px; text-transform: uppercase; font-size: 12.5px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
    border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer;
    background: var(--orange); color: #fff; text-decoration: none; min-height: 48px; font-size: 16px; line-height: 1.3;
  }
  .btn:hover { background: var(--orange-dark); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.block { width: 100%; }
  .btn.navy { background: var(--navy); }
  .btn.navy:hover { background: var(--navy-2); }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--navy); }
  .btn.on { background: var(--orange-soft); color: var(--orange-dark); border: 1px solid #F8C9AE; }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; }
  .link-btn { background: none; border: 0; color: var(--orange-dark); cursor: pointer; padding: 4px; font-weight: 500; text-decoration: underline; }

  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 5px; }
  input[type=text], input[type=email], input[type=password], input[type=tel], select, textarea {
    width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; min-height: 48px;
  }
  input:focus, select:focus, textarea:focus, .btn:focus-visible, a:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

  .banner {
    border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px;
    background: var(--danger-soft); color: #7A1B12; border: 1px solid #F6C9C2;
  }

  /* ---------- Auth ---------- */
  .auth-wrap { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 420px; margin: 0 auto; padding: 28px 16px; }
  .auth-head { text-align: center; margin-bottom: 20px; }
  .auth-head .logo { width: 180px; height: auto; display: block; margin: 0 auto 14px; }
  .auth-head .tagline { color: var(--orange-dark); font-size: 17px; margin-bottom: 8px; }
  .tabs-seg { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .tabs-seg button { flex: 1; border: 0; background: transparent; padding: 9px; border-radius: 9px; font-weight: 700; cursor: pointer; color: var(--muted); }
  .tabs-seg button.active { background: var(--navy); color: #fff; }

  /* ---------- Concepts ---------- */
  .concept { display: flex; gap: 12px; align-items: flex-start; }
  .concept .n {
    flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--orange-soft); color: var(--orange-dark);
    display: grid; place-items: center; font-family: var(--font-label); font-weight: 700; font-size: 17px;
  }

  /* ---------- Countries ---------- */
  .country-card {
    display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit;
    background: var(--card); border-radius: var(--radius); padding: 14px; border: 1px solid var(--line);
  }
  .country-card:hover, .country-card:active { border-color: var(--navy); }
  .flag { font-size: 30px; line-height: 1; }
  .section-title { font-family: var(--font-label); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted-2); font-weight: 700; margin: 0 0 6px; }
  .checks { list-style: none; padding: 0; margin: 0; }
  .checks li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
  .checks li::before { content: "✓"; color: var(--orange); font-weight: 900; }
  .checks.prep li::before { content: "•"; color: var(--navy); }
  .pledge-names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pledge-names span { background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--bg); text-decoration: none; color: var(--navy); font-weight: 700; font-size: 14px; border: 1px solid var(--line); }

  /* ---------- Lists / switches ---------- */
  .list-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: 0; }
  .list-item .meta { min-width: 0; }
  .list-item .meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch { position: relative; width: 46px; height: 28px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #C9D0DC; border-radius: 999px; transition: .2s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--orange); }
  .switch input:checked + span::before { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--orange); outline-offset: 2px; }

  /* ---------- Tab bar ---------- */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
  .tabbar-inner { max-width: 640px; margin: 0 auto; display: flex; height: var(--tabbar-h); padding: 0 4px; }
  .tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--muted-2); text-decoration: none; font-size: 11px; font-weight: 700; min-width: 0;
  }
  .tabbar a .ico { width: 44px; height: 30px; border-radius: 999px; display: grid; place-items: center; }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a.active { color: var(--navy); }
  .tabbar a.active .ico { background: var(--navy); color: #fff; }

  /* ---------- Toast / loader ---------- */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px);
    background: var(--navy); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; z-index: 50;
    max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(13,27,58,.25);
  }
  .toast.error { background: var(--danger); }
  .loader { text-align: center; padding: 48px 0; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--orange); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  pre.code { background: var(--navy); color: #E2E8F0; padding: 12px; border-radius: 12px; overflow-x: auto; font-size: 13px; }
</style>
</head>

const state = {
  lang: safeGet('svm_lang') || ((navigator.language || '').startsWith('ko') ? 'ko' : 'en'),
  session: null,
  profile: null,
  settings: {},
  countries: null,
  myPledges: new Set(),     // 내가 이름 쓴 country_id
  pledgeCounts: {},         // country_id → count
  // 처음 온 사람(발족식 QR)은 회원가입 화면부터, 로그인한 적 있으면 로그인 화면부터
  authMode: safeGet('svm_returning') ? 'login' : 'signup',   // login | signup | forgot | recovery
  adminTab: 'members',
  adminMembers: null,
  adminSearch: '',
  installPrompt: null,
};

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function t(key, vars) {
  let s = (i18n[state.lang] && i18n[state.lang][key]) ?? i18n.en[key] ?? key;
  if (vars) for (const k in vars) s = s.replaceAll('{' + k + '}', vars[k]);
  return s;
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function para(v) { return esc(v).replace(/\n/g, '<br>'); }
// 국가 콘텐츠: field / field_ko — 현재 언어 우선, 없으면 다른 언어
function loc(obj, field) {
  if (!obj) return '';
  if (state.lang === 'ko') return obj[field + '_ko'] || obj[field] || '';
  return obj[field] || obj[field + '_ko'] || '';
}
// { en, ko } 또는 { title_en, title_ko } 형식
function locPair(obj, field) {
  if (!obj) return '';
  const ko = field ? obj[field + '_ko'] : obj.ko;
  const en = field ? (obj[field + '_en'] ?? obj[field]) : obj.en;
  return (state.lang === 'ko' ? (ko || en) : (en || ko)) || '';
}
function setting(key) { return state.settings[key] ?? DEFAULTS[key]; }
function countryName(c) { return state.lang === 'ko' ? (c.name_ko || c.name_en) : (c.name_en || c.name_ko); }
function countryById(id) { return (state.countries || []).find(c => c.id === id); }
function flag(code) {
  if (!code || code.length !== 2) return '🌏';
  return String.fromCodePoint(...[...code.toUpperCase()].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));
}
function roleBadge(role) { return `<span class="badge ${esc(role)}">${role === 'graduate' ? '🎓 ' : ''}${esc(t('role_' + role))}</span>`; }
function isAdmin() { return state.profile?.role === 'admin'; }
function logo(white) { return `<img class="logo" src="assets/${white ? 'SVM_Logo_white' : 'SVM_Logo'}.svg" alt="SVM">`; }

let toastTimer;
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
}
function errMsg(e) { return (e && (e.message || e.error_description)) || t('error_generic'); }

function setLang(lang) {
  state.lang = lang;
  safeSet('svm_lang', lang);
  document.documentElement.lang = lang;
  if (state.profile && state.profile.lang !== lang) {
    state.profile.lang = lang;
    sb.from('profiles').update({ lang }).eq('id', state.profile.id).then(() => {});
  }
  render();
}
function langToggle(dark) {
  return `<div class="lang-toggle ${dark ? 'dark' : ''}" role="group" aria-label="Language">
    <button type="button" data-lang="en" class="${state.lang === 'en' ? 'active' : ''}">EN</button>
    <button type="button" data-lang="ko" class="${state.lang === 'ko' ? 'active' : ''}">한국어</button>
  </div>`;
}

// ---------- 날짜·시간 (모임 기준 시간대) ----------
const dateLocale = () => (state.lang === 'ko' ? 'ko-KR' : 'en-US');
function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString(dateLocale(), { weekday: 'long', month: 'long', day: 'numeric' });
}
function fmtTime(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return new Date(2000, 0, 1, h, m).toLocaleTimeString(dateLocale(), { hour: 'numeric', minute: '2-digit' });
}
function nowInTZ() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
    timeZone: CONFIG.TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  }).formatToParts(new Date()).map(p => [p.type, p.value]));
  return { date: `${parts.year}-${parts.month}-${parts.day}`, time: `${parts.hour}:${parts.minute}` };
}
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const x = new Date(Date.UTC(y, m - 1, d + n));
  return x.toISOString().slice(0, 10);
}
function dow(dateStr) { const [y, m, d] = dateStr.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); }
// DB 에 예정된 모임이 없을 때: 정기 일정으로 다음 모임 계산
function nextRegular(type, now) {
  const g = DEFAULTS.gatherings[type];
  let add = (g.dow - dow(now.date) + 7) % 7;
  if (add === 0 && now.time >= g.end) add = 7;
  return { type, date: addDays(now.date, add), start_time: g.start, end_time: g.end, location: null, title: null };
}

const configured = !CONFIG.SUPABASE_URL.includes('YOUR-PROJECT') && !CONFIG.SUPABASE_ANON_KEY.includes('YOUR-ANON-KEY');
const sb = configured ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

async function loadProfile() {
  if (!state.session) { state.profile = null; return; }
  const uid = state.session.user.id;
  let { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  if (!data && !error) {
    // 트리거 이전에 가입한 계정 등 — 프로필이 없으면 생성
    const meta = state.session.user.user_metadata || {};
    ({ data, error } = await sb.from('profiles')
      .insert({ id: uid, email: state.session.user.email, name: meta.name || null, lang: state.lang })
      .select().single());
  }
  if (error) { toast(errMsg(error), true); return; }
  state.profile = data;
  if (data.lang && data.lang !== state.lang) {
    state.lang = data.lang; safeSet('svm_lang', data.lang); document.documentElement.lang = data.lang;
  }
}
async function loadSettings() {
  const { data } = await sb.from('app_settings').select('key,value');
  state.settings = Object.fromEntries((data || []).map(r => [r.key, r.value]));
}
async function loadCountries(force) {
  if (state.countries && !force) return state.countries;
  const { data, error } = await sb.from('countries').select('*').order('sort_order').order('id');
  if (error) { toast(errMsg(error), true); state.countries = []; }
  else state.countries = data;
  return state.countries;
}
async function loadPledges() {
  const [mine, counts] = await Promise.all([
    sb.from('nation_pledges').select('country_id').eq('user_id', state.profile.id),
    sb.from('nation_pledge_counts').select('country_id,pledge_count'),
  ]);
  state.myPledges = new Set((mine.data || []).map(r => r.country_id));
  state.pledgeCounts = Object.fromEntries((counts.data || []).map(r => [r.country_id, r.pledge_count]));
}
async function togglePledge(c) {
  const on = state.myPledges.has(c.id);
  const q = on
    ? sb.from('nation_pledges').delete().eq('user_id', state.profile.id).eq('country_id', c.id)
    : sb.from('nation_pledges').insert({ user_id: state.profile.id, country_id: c.id });
  const { error } = await q;
  if (error && error.code !== '23505') { toast(errMsg(error), true); return; }   // 23505 = 이미 있음
  if (on) state.myPledges.delete(c.id); else state.myPledges.add(c.id);
  state.pledgeCounts[c.id] = Math.max(0, (state.pledgeCounts[c.id] || 0) + (on ? -1 : 1));
  toast(on ? t('unpledged_toast') : t('pledged_toast', { c: countryName(c) }));
  render();
}

function parseRoute() {
  const parts = (location.hash.replace(/^#\/?/, '') || 'home').split('/').filter(Boolean);
  return { tab: parts[0] || 'home', param: parts[1] ? decodeURIComponent(parts[1]) : null };
}

// 6) 렌더링
// ---------------------------------------------------------------------
const app = document.getElementById('app');
let renderSeq = 0;

async function render() {
  const seq = ++renderSeq;
  document.documentElement.lang = state.lang;

  if (!configured) { app.innerHTML = viewSetup(); bindCommon(); return; }
  if (!state.session || state.authMode === 'recovery') { app.innerHTML = viewAuth(); bindAuth(); bindCommon(); return; }
  if (!state.profile) { app.innerHTML = loaderHTML(); return; }

  let { tab, param } = parseRoute();
  if (!TABS.some(x => x.id === tab) || (tab === 'admin' && !isAdmin())) tab = 'home';

  // 탭이 바뀌지 않았으면 기존 화면을 유지한 채 내용만 교체 (깜빡임 방지)
  if (!document.getElementById('view') || app.dataset.tab !== tab) {
    app.innerHTML = shell(tab, loaderHTML());
    app.dataset.tab = tab;
  } else {
    app.querySelector('.topbar-inner').outerHTML = topbarInner();
    app.querySelector('.tabbar').outerHTML = tabbarHTML(tab);
  }
  bindCommon();
  let body;
  try {
    body = await VIEWS[tab](param);
  } catch (e) {
    console.error(e);
    body = `<div class="card">${esc(t('error_generic'))}</div>`;
  }
  if (seq !== renderSeq) return;   // 더 최신 렌더가 시작됨
  document.getElementById('view').innerHTML = body;
  bindCommon();
  BINDERS[tab]?.(param);
}

function loaderHTML() { return `<div class="loader"><div class="spinner"></div>${esc(t('loading'))}</div>`; }

function topbarInner() { return `<div class="topbar-inner"><a href="#/home" aria-label="SVM home">${logo(true)}</a>${langToggle(false)}</div>`; }
function tabbarHTML(tab) {
  const tabs = TABS.filter(x => !x.adminOnly || isAdmin());

function bindAuth() {
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { state.authMode = b.dataset.mode; render(); });
  const form = document.getElementById('auth-form');
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const f = Object.fromEntries(new FormData(form));
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      const redirectTo = location.origin + location.pathname;
      if (state.authMode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
        if (error) throw error;
      } else if (state.authMode === 'signup') {
        const { data, error } = await sb.auth.signUp({
          email: f.email.trim(), password: f.password,
          options: { emailRedirectTo: redirectTo, data: { name: f.name.trim(), lang: state.lang } },
        });
        if (error) throw error;
        if (data.session) toast(t('signup_done'));
        else { toast(t('signup_check_email')); state.authMode = 'login'; render(); }
      } else if (state.authMode === 'forgot') {
        const { error } = await sb.auth.resetPasswordForEmail(f.email.trim(), { redirectTo });
        if (error) throw error;
        toast(t('reset_sent')); state.authMode = 'login'; render();
      } else if (state.authMode === 'recovery') {
        const { error } = await sb.auth.updateUser({ password: f.password });
        if (error) throw error;
        toast(t('password_updated')); state.authMode = 'login'; render();
      }
    } catch (err) {
      toast(errMsg(err), true);
    } finally {
      btn.disabled = false;
    }
  };
}

// ---------- Views ----------
function meetingLines(g) {
  return `${esc(fmtDate(g.date))} · ${esc(fmtTime(g.start_time.slice(0, 5)))}–${esc(fmtTime(g.end_time.slice(0, 5)))}`;
}

async function upcomingMeetings() {
  const now = nowInTZ();
  const { data } = await sb.from('gatherings').select('*').gte('date', now.date)
    .order('date').order('start_time').limit(6);
  const fromDb = (data || []).filter(g => g.date > now.date || g.end_time.slice(0, 5) > now.time);
  // 종류별로 가장 가까운 모임 (DB 에 없으면 정기 일정으로 계산)
  const pick = type => fromDb.find(g => (g.type || 'sunday') === type) || nextRegular(type, now);
  const list = [pick('sunday'), pick('friday')].map(g => ({ ...g, type: g.type || 'sunday' }));
  list.sort((a, b) => (a.date + a.start_time).localeCompare(b.date + b.start_time));
  return { list, today: now.date };
}

function bindMemberList() {
  app.querySelectorAll('[data-role-for]').forEach(sel => sel.onchange = async () => {
    const id = sel.dataset.roleFor, role = sel.value;
    const prev = state.adminMembers.find(m => m.id === id);
    sel.disabled = true;
    const { error } = await sb.from('profiles').update({ role }).eq('id', id);
    sel.disabled = false;
    if (error) { toast(errMsg(error), true); sel.value = prev.role; return; }
    prev.role = role;
    toast(t('role_changed'));
  });
}

const BINDERS = {
  countries(code) {
    const btn = document.getElementById('pledge-btn');
    if (btn) btn.onclick = async () => {
      btn.disabled = true;
      const c = state.countries.find(x => x.code === code.toUpperCase());
      await togglePledge(c);
      btn.disabled = false;
    };
  },
  my() {
    const form = document.getElementById('profile-form');
    form.onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(form));
      const patch = { name: f.name.trim() || null, school: f.school.trim() || null, phone: f.phone.trim() || null };
      const { data, error } = await sb.from('profiles').update(patch).eq('id', state.profile.id).select().single();
      if (error) return toast(errMsg(error), true);
      state.profile = data;
      toast(t('saved'));
      render();
    };
    document.getElementById('logout-btn').onclick = async () => { await sb.auth.signOut(); };
    const ib = document.getElementById('install-btn');
    if (ib) ib.onclick = async () => {
      if (!state.installPrompt) return;
      state.installPrompt.prompt();
      await state.installPrompt.userChoice;
      state.installPrompt = null;
      ib.classList.add('hidden');
    };
  },
  admin() {
    app.querySelectorAll('[data-admin-tab]').forEach(b => b.onclick = () => { state.adminTab = b.dataset.adminTab; render(); });
    const search = document.getElementById('member-search');
    if (search) {
      search.oninput = () => {
        state.adminSearch = search.value;
        document.getElementById('member-list').innerHTML = memberListHTML();
        bindMemberList();
      };
      bindMemberList();
    }
    app.querySelectorAll('[data-setting]').forEach(cb => cb.onchange = async () => {
      const { error } = await sb.from('app_settings').upsert({ key: cb.dataset.setting, value: cb.checked });
      if (error) { cb.checked = !cb.checked; return toast(errMsg(error), true); }
      state.settings[cb.dataset.setting] = cb.checked;
      toast(t('saved'));
    });
    app.querySelectorAll('[data-country]').forEach(cb => cb.onchange = async () => {
      const { error } = await sb.from('countries').update({ [cb.dataset.field]: cb.checked }).eq('id', cb.dataset.country);
      if (error) { cb.checked = !cb.checked; return toast(errMsg(error), true); }
      state.countries = null;   // 다음에 다시 불러오기
      toast(t('saved'));
    });
  },
};

// ---------------------------------------------------------------------
// 7) 시작
// ---------------------------------------------------------------------
async function onSession(session) {
  const prevUser = state.session?.user?.id;
  state.session = session;
  if (!session) {
    state.profile = null; state.adminMembers = null; state.countries = null;
    state.myPledges = new Set(); state.pledgeCounts = {};
    delete app.dataset.tab;
    render();
    return;
  }
  safeSet('svm_returning', '1');
  if (prevUser !== session.user.id || !state.profile) {
    render();   // 로더 표시
    await Promise.all([loadProfile(), loadSettings()]);
  }
  render();
}

function init() {
  document.documentElement.lang = state.lang;
  if (!configured) { render(); return; }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { state.authMode = 'recovery'; state.session = session; render(); return; }
    if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') { state.session = session; return; }
    if (event === 'SIGNED_IN' && state.session?.user?.id === session?.user?.id && state.profile) return;
    // INITIAL_SESSION / SIGNED_IN / SIGNED_OUT
    // 콜백 안에서 Supabase 호출 시 데드락 방지 — 다음 틱에 처리
    setTimeout(() => onSession(session), 0);
  });
}

window.addEventListener('hashchange', () => { if (state.session && state.profile) render(); window.scrollTo(0, 0); });
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); state.installPrompt = e; document.getElementById('install-btn')?.classList.remove('hidden'); });
window.addEventListener('offline', () => toast(t('offline'), true));

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

init();
</script>
