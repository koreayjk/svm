<style>
  :root {
    --navy: #1d2b53;
    --navy-2: #2c3e74;
    --gold: #e0a526;
    --gold-soft: #fdf3dc;
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1b1f2a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --danger: #c0392b;
    --danger-soft: #fdecea;
    --ok: #1e8e5a;
    --ok-soft: #e6f6ee;
    --radius: 14px;
    --tabbar-h: 64px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--navy-2); }
  .hidden { display: none !important; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--navy); color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .5px; }
  .brand-img { width: 34px; height: 34px; border-radius: 9px; display: block; }
  .brand small { display: block; font-weight: 500; font-size: 11px; opacity: .75; letter-spacing: 0; }
  .lang-toggle {
    display: inline-flex; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; overflow: hidden;
  }
  .lang-toggle button {
    background: transparent; border: 0; color: #fff; padding: 4px 10px; font-size: 13px; cursor: pointer;
  }
  .lang-toggle button.active { background: #fff; color: var(--navy); font-weight: 700; }
  .lang-toggle.dark { border-color: var(--line); }
  .lang-toggle.dark button { color: var(--muted); }
  .lang-toggle.dark button.active { background: var(--navy); color: #fff; }

  /* ---------- Layout ---------- */
  main {
    max-width: 640px; margin: 0 auto;
    padding: 16px 16px calc(var(--tabbar-h) + var(--safe-b) + 24px);
  }
  h1 { font-size: 24px; margin: 4px 0 12px; }
  h2 { font-size: 18px; margin: 20px 0 10px; }
  h3 { font-size: 16px; margin: 0 0 6px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 16px;
    box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
    margin-bottom: 12px;
  }
  .card.hero { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; }
  .card.hero .muted { color: rgba(255,255,255,.75); }
  .card.soon { opacity: .9; border: 1px dashed var(--line); box-shadow: none; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .stack > * + * { margin-top: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 700; background: var(--line); color: var(--text); white-space: nowrap;
  }
  .badge.member { background: #e8edf9; color: var(--navy-2); }
  .badge.graduate { background: var(--gold-soft); color: #8a5a00; }
  .badge.admin { background: var(--navy); color: #fff; }
  .badge.sensitive { background: var(--danger-soft); color: var(--danger); }
  .badge.soon { background: #eef0f4; color: var(--muted); font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700; cursor: pointer;
    background: var(--navy); color: #fff; text-decoration: none; min-height: 44px;
  }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.block { width: 100%; }
  .btn.gold { background: var(--gold); color: var(--navy); }
  .btn.ghost { background: transparent; color: var(--navy); border: 1px solid var(--line); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.small { padding: 6px 12px; min-height: 34px; font-size: 14px; }
  .link-btn { background: none; border: 0; color: var(--navy-2); cursor: pointer; padding: 4px; text-decoration: underline; }

  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #374151; }
  input[type=text], input[type=email], input[type=password], input[type=tel], select, textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
    min-height: 44px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: transparent; }

  .banner {
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px;
    background: var(--danger-soft); color: #7a1f16; border: 1px solid #f5c2bc;
  }
  .banner.info { background: var(--gold-soft); color: #6b4700; border-color: #f1d99a; }

  /* ---------- Auth ---------- */
  .auth-wrap {
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
    max-width: 420px; margin: 0 auto; padding: 24px 16px;
  }
  .auth-head { text-align: center; margin-bottom: 20px; }
  .auth-logo { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 12px; }
  .tabs-seg { display: flex; background: #e9ecf3; border-radius: 10px; padding: 3px; margin-bottom: 16px; }
  .tabs-seg button {
    flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--muted);
  }
  .tabs-seg button.active { background: #fff; color: var(--navy); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* ---------- Concepts ---------- */
  .concept { display: flex; gap: 12px; align-items: flex-start; }
  .concept .num {
    flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--gold-soft); color: #8a5a00;
    display: grid; place-items: center; font-weight: 800; font-size: 14px;
  }

  /* ---------- Countries ---------- */
  .country-card {
    display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit;
    background: var(--card); border-radius: var(--radius); padding: 14px;
    box-shadow: 0 1px 2px rgba(16,24,40,.06); border: 1px solid transparent;
  }
  .country-card:active { border-color: var(--gold); }
  .flag { font-size: 30px; line-height: 1; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; margin: 0 0 4px; }

  /* ---------- Lists ---------- */
  .list-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: 0; }
  .list-item .meta { min-width: 0; }
  .list-item .meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch { position: relative; width: 46px; height: 28px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #cfd4de; border-radius: 999px; transition: .2s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::before { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--gold); }

  /* ---------- Tab bar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #fff; border-top: 1px solid var(--line);
    padding-bottom: var(--safe-b);
  }
  .tabbar-inner { max-width: 640px; margin: 0 auto; display: flex; height: var(--tabbar-h); }
  .tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600;
  }
  .tabbar a svg { width: 24px; height: 24px; }
  .tabbar a.active { color: var(--navy); }
  .tabbar a.active svg { stroke: var(--gold); }

  /* ---------- Toast / loader ---------- */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px);
    background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50;
    max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  .toast.error { background: var(--danger); }
  .loader { text-align: center; padding: 48px 0; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--navy); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  pre.code { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 10px; overflow-x: auto; font-size: 13px; }
</style>

const state = {
  lang: safeGet('svm_lang') || ((navigator.language || '').startsWith('ko') ? 'ko' : 'en'),
  session: null,
  profile: null,
  settings: {},
  countries: null,
  authMode: 'login',      // login | signup | forgot | recovery
  adminTab: 'members',
  adminMembers: null,
  adminSearch: '',
  installPrompt: null,
};

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function t(key, vars) {
  let s = (i18n[state.lang] && i18n[state.lang][key]) ?? i18n.en[key] ?? key;
  if (vars) for (const k in vars) s = s.replaceAll('{' + k + '}', vars[k]);
  return s;
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// 줄바꿈 유지 텍스트
function para(v) { return esc(v).replace(/\n/g, '<br>'); }
// 국가 콘텐츠: 현재 언어 우선, 없으면 영어
function loc(obj, field) {
  if (!obj) return '';
  if (state.lang === 'ko') return obj[field + '_ko'] || obj[field] || '';
  return obj[field] || obj[field + '_ko'] || '';
}
// extra_sections 항목: { title_en, title_ko, body_en, body_ko }
function locPair(obj, field) {
  const ko = obj[field + '_ko'], en = obj[field + '_en'] ?? obj[field];
  return (state.lang === 'ko' ? (ko || en) : (en || ko)) || '';
}
function countryName(c) { return state.lang === 'ko' ? (c.name_ko || c.name_en) : (c.name_en || c.name_ko); }
function flag(code) {
  if (!code || code.length !== 2) return '🌏';
  return String.fromCodePoint(...[...code.toUpperCase()].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));
}
function roleBadge(role) { return `<span class="badge ${esc(role)}">${role === 'graduate' ? '🎓 ' : ''}${esc(t('role_' + role))}</span>`; }
function isAdmin() { return state.profile?.role === 'admin'; }

let toastTimer;
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
}
function errMsg(e) { return (e && (e.message || e.error_description)) || t('error_generic'); }

function setLang(lang) {
  state.lang = lang;
  safeSet('svm_lang', lang);
  document.documentElement.lang = lang;
  if (state.profile && state.profile.lang !== lang) {
    state.profile.lang = lang;
    sb.from('profiles').update({ lang }).eq('id', state.profile.id).then(() => {});
  }
  render();
}
function langToggle(dark) {
  return `<div class="lang-toggle ${dark ? 'dark' : ''}" role="group" aria-label="Language">
    <button type="button" data-lang="en" class="${state.lang === 'en' ? 'active' : ''}">EN</button>
    <button type="button" data-lang="ko" class="${state.lang === 'ko' ? 'active' : ''}">한국어</button>
  </div>`;
}

// 날짜 포맷 (게더링 기준 시간대)
function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString(state.lang === 'ko' ? 'ko-KR' : 'en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function fmtTime(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const d = new Date(2000, 0, 1, h, m);
  return d.toLocaleTimeString(state.lang === 'ko' ? 'ko-KR' : 'en-US', { hour: 'numeric', minute: '2-digit' });
}
// 게더링 시간대 기준 오늘 날짜 (YYYY-MM-DD)
function todayInTZ() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG.TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function nextSunday() {
  const [y, m, d] = todayInTZ().split('-').map(Number);
  const base = new Date(Date.UTC(y, m - 1, d));
  const add = (7 - base.getUTCDay()) % 7;
  base.setUTCDate(base.getUTCDate() + add);
  return base.toISOString().slice(0, 10);
}

const configured = !CONFIG.SUPABASE_URL.includes('YOUR-PROJECT') && !CONFIG.SUPABASE_ANON_KEY.includes('YOUR-ANON-KEY');
const sb = configured ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

async function loadProfile() {
  if (!state.session) { state.profile = null; return; }
  const uid = state.session.user.id;
  let { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  if (!data && !error) {
    // 트리거 이전에 가입한 계정 등 — 프로필이 없으면 생성
    const meta = state.session.user.user_metadata || {};
    ({ data, error } = await sb.from('profiles')
      .insert({ id: uid, email: state.session.user.email, name: meta.name || null, school: meta.school || null, phone: meta.phone || null, lang: state.lang })
      .select().single());
  }
  if (error) { toast(errMsg(error), true); return; }
  state.profile = data;
  if (data.lang && data.lang !== state.lang) {
    state.lang = data.lang; safeSet('svm_lang', data.lang); document.documentElement.lang = data.lang;
  }
}
async function loadSettings() {
  const { data } = await sb.from('app_settings').select('key,value');
  state.settings = Object.fromEntries((data || []).map(r => [r.key, r.value]));
}
async function loadCountries(force) {
  if (state.countries && !force) return state.countries;
  const { data, error } = await sb.from('countries').select('*').order('sort_order').order('id');
  if (error) { toast(errMsg(error), true); state.countries = []; }
  else state.countries = data;
  return state.countries;
}

function parseRoute() {
  const parts = (location.hash.replace(/^#\/?/, '') || 'home').split('/').filter(Boolean);
  return { tab: parts[0] || 'home', param: parts[1] ? decodeURIComponent(parts[1]) : null };
}
function go(path) { location.hash = '#/' + path; }

const app = document.getElementById('app');
let renderSeq = 0;

async function render() {
  const seq = ++renderSeq;
  document.documentElement.lang = state.lang;

  if (!configured) { app.innerHTML = viewSetup(); bindCommon(); return; }
  if (!state.session || state.authMode === 'recovery') { app.innerHTML = viewAuth(); bindAuth(); bindCommon(); return; }
  if (!state.profile) { app.innerHTML = loaderHTML(); return; }

  let { tab, param } = parseRoute();
  if (!TABS.some(x => x.id === tab) || (tab === 'admin' && !isAdmin())) tab = 'home';

  app.innerHTML = shell(tab, loaderHTML());
  bindCommon();
  let body;
  try {
    body = await VIEWS[tab](param);
  } catch (e) {
    console.error(e);
    body = `<div class="card">${esc(t('error_generic'))}</div>`;
  }
  if (seq !== renderSeq) return;   // 더 최신 렌더가 시작됨
  document.getElementById('view').innerHTML = body;
  bindCommon();
  BINDERS[tab]?.(param);
}

function loaderHTML() { return `<div class="loader"><div class="spinner"></div>${esc(t('loading'))}</div>`; }

function shell(tab, inner) {
  const tabs = TABS.filter(x => !x.adminOnly || isAdmin());
  return `
  <header class="topbar">
    <div class="brand"><img class="brand-img" src="icons/icon.svg" alt=""><div>SVM<small>${esc(t('app_tagline'))}</small></div></div>
    ${langToggle(false)}
  </header>
  <main id="view">${inner}</main>
  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-inner">
      ${tabs.map(x => `<a href="#/${x.id}" class="${x.id === tab ? 'active' : ''}" ${x.id === tab ? 'aria-current="page"' : ''}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${x.icon}</svg>
        <span>${esc(t('tab_' + x.id))}</span></a>`).join('')}

  </nav>`;
}

    form = `<form id="auth-form" novalidate>

      <label class="field"><span>${esc(t('email'))}</span><input type="email" name="email" autocomplete="email" required></label>

    </form>`;
  } else if (m === 'forgot') {
    form = `<form id="auth-form" novalidate>
      <label class="field"><span>${esc(t('email'))}</span><input type="email" name="email" autocomplete="email" required></label>
      <button class="btn block" type="submit">${esc(t('send_reset'))}</button>
      <div style="text-align:center;margin-top:10px"><button type="button" class="link-btn" data-mode="login">${esc(t('back_to_login'))}</button></div>
    </form>`;
  } else {
    form = `<form id="auth-form" novalidate>
      <label class="field"><span>${esc(t('new_password'))} <span class="muted">(${esc(t('password_hint'))})</span></span><input type="password" name="password" autocomplete="new-password" minlength="6" required></label>
      <button class="btn block" type="submit">${esc(t('set_password'))}</button>
    </form>`;
  }
  const seg = (m === 'login' || m === 'signup') ? `<div class="tabs-seg" role="tablist">
      <button type="button" role="tab" data-mode="login" class="${m === 'login' ? 'active' : ''}">${esc(t('login'))}</button>
      <button type="button" role="tab" data-mode="signup" class="${m === 'signup' ? 'active' : ''}">${esc(t('signup'))}</button>
    </div>` : `<h2 style="margin-top:0">${esc(m === 'forgot' ? t('forgot_password') : t('set_password'))}</h2>`;
  return `<div class="auth-wrap">
    <div class="auth-head">
      <img class="auth-logo" src="icons/icon.svg" alt="SVM">

      <p class="muted" style="margin-bottom:6px">${esc(t('app_tagline'))}</p>
      <p class="small muted">${esc(t('auth_welcome'))}</p>
    </div>
    <div class="card">${seg}${form}</div>
    <div style="text-align:center">${langToggle(true)}</div>
  </div>`;
}

function bindAuth() {
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { state.authMode = b.dataset.mode; render(); });
  const form = document.getElementById('auth-form');
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const f = Object.fromEntries(new FormData(form));
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      const redirectTo = location.origin + location.pathname;
      if (state.authMode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
        if (error) throw error;
      } else if (state.authMode === 'signup') {
        const { data, error } = await sb.auth.signUp({
          email: f.email.trim(), password: f.password,
          options: {
            emailRedirectTo: redirectTo,
            data: { name: f.name.trim(), school: (f.school || '').trim(), phone: (f.phone || '').trim(), lang: state.lang },
          },
        });
        if (error) throw error;
        if (data.session) toast(t('signup_done'));
        else { toast(t('signup_check_email')); state.authMode = 'login'; render(); }
      } else if (state.authMode === 'forgot') {
        const { error } = await sb.auth.resetPasswordForEmail(f.email.trim(), { redirectTo });
        if (error) throw error;
        toast(t('reset_sent')); state.authMode = 'login'; render();
      } else if (state.authMode === 'recovery') {
        const { error } = await sb.auth.updateUser({ password: f.password });
        if (error) throw error;
        toast(t('password_updated')); state.authMode = 'login'; render();
      }
    } catch (err) {
      toast(errMsg(err), true);
    } finally {
      btn.disabled = false;
    }
  };
}

function bindCommon() {
  app.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  app.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => toast(t('coming_soon') + ' · ' + t('phase', { n: b.dataset.soon })));
}

          <label class="field"><span>${esc(t('school'))}</span><input type="text" name="school" value="${esc(p.school)}"></label>
          <label class="field"><span>${esc(t('phone'))}</span><input type="tel" name="phone" value="${esc(p.phone)}" autocomplete="tel"></label>
          <button class="btn" type="submit">${esc(t('save'))}</button>
        </form>
      </div>
      <div class="card row between"><strong>${esc(t('language_setting'))}</strong>${langToggle(true)}</div>
      ${soonCard(t('my_app_t'), t('apply_here'), 2, '✈️')}
      ${soonCard(t('my_check_t'), t('my_check_t'), 4, '🧳')}
      ${soonCard(t('my_att_t'), t('gathering_every'), 4, '📅')}
      <div class="card stack">
        <button class="btn ghost block ${state.installPrompt ? '' : 'hidden'}" id="install-btn">📲 ${esc(t('install_app'))}</button>
        ${isIOS ? `<p class="small muted" style="margin:0">📲 ${esc(t('install_ios'))}</p>` : ''}
        <button class="btn danger block" id="logout-btn">${esc(t('logout'))}</button>
      </div>`;
  },

  async admin() {
    const tab = state.adminTab;
    const seg = `<div class="tabs-seg" role="tablist">
      ${['members', 'settings', 'countries'].map(k => `<button type="button" role="tab" data-admin-tab="${k}" class="${tab === k ? 'active' : ''}">${esc(t('admin_' + k))}</button>`).join('')}
    </div>`;
    let body = '';
    if (tab === 'members') {
      if (!state.adminMembers) {
        const { data, error } = await sb.from('profiles').select('id,name,email,school,role,created_at').order('created_at', { ascending: false });
        if (error) throw error;
        state.adminMembers = data;
      }
      body = `<input type="text" id="member-search" placeholder="${esc(t('search_members'))}" value="${esc(state.adminSearch)}" style="margin-bottom:12px">
        <div class="card" id="member-list">${memberListHTML()}</div>`;
    } else if (tab === 'settings') {
      await loadSettings();
      const s = state.settings;
      const sw = (key, title, desc) => `<div class="list-item">
        <div class="meta" style="white-space:normal"><strong>${esc(title)}</strong><p class="muted small" style="margin:2px 0 0">${esc(desc)}</p></div>
        <label class="switch"><input type="checkbox" data-setting="${key}" ${s[key] === true ? 'checked' : ''} aria-label="${esc(title)}"><span></span></label>
      </div>`;
      body = `<div class="card">
        ${sw('require_graduation_to_apply', t('set_require_grad'), t('set_require_grad_d'))}
        ${sw('sensitive_photo_block', t('set_photo_block'), t('set_photo_block_d'))}
      </div>`;
    } else {
      const list = await loadCountries(true);
      body = `<div class="card">
        <div class="list-item small muted"><span>${esc(t('admin_countries'))}</span><span class="row" style="gap:18px"><span>${esc(t('col_sensitive'))}</span><span>${esc(t('col_active'))}</span></span></div>
        ${list.map(c => `<div class="list-item">
          <div class="meta row"><span class="flag" style="font-size:22px">${flag(c.code)}</span><strong>${esc(countryName(c))}</strong></div>
          <div class="row" style="gap:12px">
            <label class="switch"><input type="checkbox" data-country="${c.id}" data-field="is_sensitive" ${c.is_sensitive ? 'checked' : ''} aria-label="${esc(countryName(c))} ${esc(t('col_sensitive'))}"><span></span></label>
            <label class="switch"><input type="checkbox" data-country="${c.id}" data-field="is_active" ${c.is_active ? 'checked' : ''} aria-label="${esc(countryName(c))} ${esc(t('col_active'))}"><span></span></label>
          </div>
        </div>`).join('')}
      </div>`;
    }
    return `<h1>${esc(t('admin_title'))}</h1>${seg}${body}
      <p class="muted small">${esc(t('admin_more'))}</p>`;
  },
};

function viewCountryDetail(c) {
  if (!c) return `<a href="#/countries" class="link-btn">← ${esc(t('back'))}</a><div class="card">${esc(t('not_found'))}</div>`;
  const sections = [
    ['sec_intro', 'intro'], ['sec_ministry', 'ministry'], ['sec_life', 'daily_life'],
    ['sec_language', 'language'], ['sec_housing', 'housing'],
  ].filter(([, f]) => loc(c, f));
  const extras = (Array.isArray(c.extra_sections) ? c.extra_sections : []).filter(x => x && (locPair(x, 'title') || locPair(x, 'body')));
  return `
    <a href="#/countries" class="link-btn" style="padding-left:0">← ${esc(t('back'))}</a>
    ${c.is_sensitive ? `<div class="banner" style="margin-top:8px">🔒 ${esc(t('sensitive_banner'))}</div>` : ''}
    <div class="row" style="margin:8px 0 14px"><span class="flag" style="font-size:44px">${flag(c.code)}</span>
      <div><h1 style="margin:0">${esc(countryName(c))}</h1>
      ${c.is_sensitive ? `<span class="badge sensitive">🔒 ${esc(t('sensitive'))}</span>` : ''}</div></div>
    ${sections.map(([k, f]) => `<div class="card"><div class="section-title">${esc(t(k))}</div><p style="margin:0">${para(loc(c, f))}</p></div>`).join('')}
    ${extras.map(x => `<div class="card"><div class="section-title">${esc(locPair(x, 'title'))}</div><p style="margin:0">${para(locPair(x, 'body'))}</p></div>`).join('')}
    <div class="grid2" style="margin-top:8px">
      <button class="btn ghost" data-soon="2">💬 ${esc(t('enter_room'))}</button>
      <button class="btn gold" data-soon="2">✈️ ${esc(t('apply_here'))}</button>
    </div>`;
}

function memberListHTML() {
  const q = state.adminSearch.trim().toLowerCase();
  const list = (state.adminMembers || []).filter(m => !q || [m.name, m.email, m.school].some(v => (v || '').toLowerCase().includes(q)));
  return `<div class="small muted" style="margin-bottom:4px">${esc(t('members_count', { n: list.length }))}</div>` +
    list.map(m => `<div class="list-item">
      <div class="meta"><div><strong>${esc(m.name || '—')}</strong></div>
        <div class="small muted">${esc(m.email)}${m.school ? ' · ' + esc(m.school) : ''}</div></div>
      <select data-role-for="${esc(m.id)}" style="width:auto;min-width:120px" ${m.id === state.profile.id ? 'disabled' : ''} aria-label="Role">
        ${['member', 'graduate', 'admin'].map(r => `<option value="${r}" ${m.role === r ? 'selected' : ''}>${esc(t('role_' + r))}</option>`).join('')}
      </select>
    </div>`).join('');
}
function bindMemberList() {
  app.querySelectorAll('[data-role-for]').forEach(sel => sel.onchange = async () => {
    const id = sel.dataset.roleFor, role = sel.value;
    const prev = state.adminMembers.find(m => m.id === id);
    sel.disabled = true;
    const { error } = await sb.from('profiles').update({ role }).eq('id', id);
    sel.disabled = false;
    if (error) { toast(errMsg(error), true); sel.value = prev.role; return; }
    prev.role = role;
    toast(t('role_changed'));
  });
}

const BINDERS = {
  my() {
    const form = document.getElementById('profile-form');
    form.onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(form));
      const patch = { name: f.name.trim() || null, school: f.school.trim() || null, phone: f.phone.trim() || null };
      const { data, error } = await sb.from('profiles').update(patch).eq('id', state.profile.id).select().single();
      if (error) return toast(errMsg(error), true);
      state.profile = data;
      toast(t('saved'));
      render();
    };
    document.getElementById('logout-btn').onclick = async () => { await sb.auth.signOut(); };
    const ib = document.getElementById('install-btn');
    if (ib) ib.onclick = async () => {
      if (!state.installPrompt) return;
      state.installPrompt.prompt();
      await state.installPrompt.userChoice;
      state.installPrompt = null;
      ib.classList.add('hidden');
    };
  },
  admin() {
    app.querySelectorAll('[data-admin-tab]').forEach(b => b.onclick = () => { state.adminTab = b.dataset.adminTab; render(); });
    const search = document.getElementById('member-search');
    if (search) {
      search.oninput = () => {
        state.adminSearch = search.value;
        document.getElementById('member-list').innerHTML = memberListHTML();
        bindMemberList();
      };
      bindMemberList();
    }
    app.querySelectorAll('[data-setting]').forEach(cb => cb.onchange = async () => {
      const { error } = await sb.from('app_settings').upsert({ key: cb.dataset.setting, value: cb.checked });
      if (error) { cb.checked = !cb.checked; return toast(errMsg(error), true); }
      state.settings[cb.dataset.setting] = cb.checked;
      toast(t('saved'));
    });
    app.querySelectorAll('[data-country]').forEach(cb => cb.onchange = async () => {
      const { error } = await sb.from('countries').update({ [cb.dataset.field]: cb.checked }).eq('id', cb.dataset.country);
      if (error) { cb.checked = !cb.checked; return toast(errMsg(error), true); }
      state.countries = null;   // 다음에 다시 불러오기
      toast(t('saved'));
    });
  },
};

// ---------------------------------------------------------------------
// 7) 시작
// ---------------------------------------------------------------------
async function onSession(session) {
  const prevUser = state.session?.user?.id;
  state.session = session;
  if (!session) {
    state.profile = null; state.adminMembers = null; state.countries = null;
    render();
    return;
  }
  if (prevUser !== session.user.id || !state.profile) {
    render();   // 로더 표시
    await Promise.all([loadProfile(), loadSettings()]);
  }
  render();
}

async function init() {
  document.documentElement.lang = state.lang;
  if (!configured) { render(); return; }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { state.authMode = 'recovery'; state.session = session; render(); return; }
    if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') { state.session = session; return; }
    if (event === 'SIGNED_IN' && state.session?.user?.id === session?.user?.id && state.profile) return;
    // INITIAL_SESSION / SIGNED_IN / SIGNED_OUT
    // 콜백 안에서 Supabase 호출 시 데드락 방지 — 다음 틱에 처리
    setTimeout(() => onSession(session), 0);
  });
}

window.addEventListener('hashchange', () => { if (state.session && state.profile) render(); window.scrollTo(0, 0); });
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); state.installPrompt = e; document.getElementById('install-btn')?.classList.remove('hidden'); });
window.addEventListener('offline', () => toast(t('offline'), true));

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

init();
</script>
</body>
