name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  sql:
    name: SQL · 권한(RLS) 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 임시 Postgres 로 sql/01~14 와 시나리오 실행
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          bash tests/sql/run.sh
  e2e:
    name: 앱 화면 흐름 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node tests/e2e/run.js
