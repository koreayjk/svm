<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // GitHub Pages serves this file at any depth; point links back at the site root (/svm/ on Pages, / locally)
  document.write('<base href="' + (location.pathname.startsWith('/svm/') || location.pathname === '/svm' ? '/svm/' : '/') + '">');
</script>
<title>Page not found · SVM</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F3F8">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  .nf { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 40px 20px 60px; position: relative; overflow: hidden; }
  .nf::before { content: ""; position: absolute; inset: 0; background: url("assets/world-dots.svg") center 30% / min(1100px, 160%) no-repeat; opacity: .16; z-index: -1; }
  .nf .logo { height: 30px; width: auto; margin: 0 auto 36px; }
  .nf .code { font-family: var(--font-num); font-weight: 700; font-size: clamp(88px, 22vw, 150px); line-height: .9; letter-spacing: -.01em; color: var(--orange); }
  .nf h1 { font-size: clamp(26px, 4.4vw, 36px); font-weight: 900; letter-spacing: -.03em; line-height: 1.2; margin: 14px 0 10px; text-wrap: balance; }
  .nf p { color: var(--muted); font-size: 17px; max-width: 30em; margin: 0 auto 28px; text-wrap: pretty; }
  .nf .ctas { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .nf .lang { margin-top: 30px; }
</style>
</head>
<body>
<main class="nf">
  <div>
    <a href="./" aria-label="SVM home"><img class="logo" src="assets/SVM_Logo.svg" alt="SVM" width="96" height="30"></a>
    <div class="code" aria-hidden="true">404</div>
    <h1 data-k="nf_h">This page is not on the map</h1>
    <p data-k="nf_p">The link may be old or mistyped. Every field is still a tap away.</p>
    <div class="ctas">
      <a class="btn" href="./" data-k="nf_home">Go to SVM home</a>
      <a class="btn ghost" href="conference/" data-k="nf_conf">Nov 20 Conference</a>
      <a class="btn ghost app-link" href="app/" data-k="nf_app">Open the app</a>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ko" aria-pressed="false">한국어</button>
    </div>
  </div>
</main>
<script>
  window.SVM_BASE = document.querySelector('base').getAttribute('href');
  window.KO = { nf_h: '지도에 없는 페이지예요', nf_p: '링크가 오래됐거나 주소가 잘못된 것 같아요. 선교지는 여전히 한 번만 누르면 됩니다.', nf_home: 'SVM 홈으로', nf_conf: '11/20 컨퍼런스', nf_app: '앱 열기' };
</script>
<script src="assets/site.js"></script>
</body>
</html>
