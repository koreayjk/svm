const nameCache = {};   // user_id → { name, role } (profile_names 뷰: 이메일·전화번호 없음)
async function loadNames(ids) {
  const need = [...new Set(ids)].filter(id => id && !(id in nameCache));
  if (!need.length) return;
  const { data } = await sb.from('profile_names').select('id,name,role').in('id', need);
  (data || []).forEach(r => { nameCache[r.id] = r; });
  need.forEach(id => { if (!(id in nameCache)) nameCache[id] = null; });
}
// 채팅에서는 "이름 + 성 이니셜"만 (예: Grace K.)
function shortName(n) {
  const p = String(n || '').trim().split(/\s+/).filter(Boolean);
  return p.length > 1 ? `${p[0]} ${p[p.length - 1][0].toUpperCase()}.` : (p[0] || '—');
}
async function loadRooms() {
  const { data } = await sb.from('room_members').select('country_id,last_read_at').eq('user_id', state.profile.id);
  state.rooms = Object.fromEntries((data || []).map(r => [r.country_id, r.last_read_at]));
  return state.rooms;
}
async function roomMemberCounts() {
  const { data } = await sb.from('room_members').select('country_id');
  const counts = {};
  (data || []).forEach(r => { counts[r.country_id] = (counts[r.country_id] || 0) + 1; });
  return counts;
}
async function roomSummary(cid, since) {
  const [last, unread] = await Promise.all([
    sb.from('messages').select('body,user_id,created_at').eq('country_id', cid).eq('deleted', false).order('created_at', { ascending: false }).limit(1),
    since ? sb.from('messages').select('id', { count: 'exact', head: true }).eq('country_id', cid).eq('deleted', false)
      .gt('created_at', since).neq('user_id', state.profile.id) : Promise.resolve({ count: 0 }),
  ]);
  return { last: last.data?.[0] || null, unread: unread.count || 0 };
}
function membersLabel(n) { return n === 1 ? t('room_members_one') : t('room_members', { n }); }
function msgTime(iso) { return new Date(iso).toLocaleTimeString(dateLocale(), { hour: 'numeric', minute: '2-digit' }); }
function msgDay(iso) {
  const d = new Date(iso), today = new Date(), y = new Date(Date.now() - 86400000);
  if (d.toDateString() === today.toDateString()) return t('today');
  if (d.toDateString() === y.toDateString()) return t('yesterday');
  return d.toLocaleDateString(dateLocale(), { weekday: 'short', month: 'short', day: 'numeric' });
}
function msgHTML(m, prev) {
  const me = m.user_id === state.profile.id;
  const newDay = !prev || new Date(prev.created_at).toDateString() !== new Date(m.created_at).toDateString();
  const cont = !newDay && prev && prev.user_id === m.user_id && (new Date(m.created_at) - new Date(prev.created_at)) < 5 * 60e3;
  const who = me ? t('you') : shortName(nameCache[m.user_id]?.name);
  const canDelete = isAdmin() && !m.deleted;
  return `${newDay ? `<div class="day-sep">${esc(msgDay(m.created_at))}</div>` : ''}
    <div class="msg ${me ? 'me' : ''} ${cont ? 'cont' : ''} ${m.deleted ? 'gone' : ''}" data-msg="${m.id}">
      <div class="who">${esc(who)}</div>
      <div class="bubble">${m.deleted ? esc(t('room_deleted')) : esc(m.body)}</div>
      <div class="foot"><span>${esc(msgTime(m.created_at))}</span>${canDelete ? `<button type="button" data-del-msg="${m.id}">${esc(t('room_delete'))}</button>` : ''}</div>
    </div>`;
}
function chatHTML(list) {
  if (!list.length) return `<div class="chat-empty">${icon('chat', 'width="30" height="30" style="color:#B4BBC7"')}<p style="margin:8px 0 0">${esc(t('room_empty'))}</p></div>`;
  return list.map((m, i) => msgHTML(m, list[i - 1])).join('');
}
function closeRoomSub() {
  if (state.roomSub) { try { sb.removeChannel(state.roomSub.ch); } catch (e) {} }
  state.roomSub = null; state.roomOnEvent = null;
}
// 읽음 표시: 서버 시각 기준(마지막 메시지 시각)으로 저장해 기기 시계 차이 영향을 없앰
function markRoomRead(cid, iso) {
  if (!(cid in (state.rooms || {})) || !iso) return;
  if (state.rooms[cid] && state.rooms[cid] >= iso) return;
  state.rooms[cid] = iso;
  sb.from('room_members').update({ last_read_at: iso }).eq('user_id', state.profile.id).eq('country_id', cid).then(() => {});
}

VIEWS.rooms = async function (code) {
  const list = await loadCountries();
  const c = code && list.find(x => x.code === code.toUpperCase() && x.is_active);
  const back = `<div style="padding-top:8px"><a href="#/community" class="back-pill">${icon('chevl')}${esc(t('community_title'))}</a></div>`;
  if (!c) return back + `<div style="margin-top:12px">${card(`<h3>${esc(t('not_found'))}</h3>`)}</div>`;
  const [rooms, msgs, members] = await Promise.all([
    loadRooms(),
    sb.from('messages').select('id,user_id,body,created_at,deleted').eq('country_id', c.id).order('created_at', { ascending: false }).limit(80),
    sb.from('room_members').select('user_id', { count: 'exact', head: true }).eq('country_id', c.id),
  ]);
  const joined = c.id in rooms;
  const items = (msgs.data || []).reverse();
  await loadNames(items.map(m => m.user_id));
  state.room = { id: c.id, code: c.code, list: items };
  return `${back}
    <div class="room-head">
      <span class="flag-tile" aria-hidden="true">${flag(c.code)}</span>
      <div class="meta"><h1>${esc(countryName(c))}</h1>
        <div class="small muted">${esc(membersLabel(members.count || 0))} · <a href="#/countries/${esc(c.code)}">${esc(t('room_about', { c: countryName(c) }))}</a> · <a href="#/prayers/${esc(c.code)}">${esc(t('room_prayers'))}</a></div></div>
      ${joined ? `<button class="btn light small" id="room-leave">${esc(t('room_leave'))}</button>` : ''}
    </div>
    ${c.is_sensitive ? `<div class="banner" role="note">${icon('lock')}<span>${esc(t('sensitive_banner'))}</span></div>` : ''}
    ${joined ? '' : card(`<p style="margin:0 0 14px">${esc(t('room_join_d'))}</p>
      <button class="btn block" id="room-join">${icon('chat')} ${esc(t('room_join'))}</button>`)}
    <div class="chat" id="chat" aria-live="polite">${chatHTML(items)}</div>
    ${joined ? `<p class="small muted" style="text-align:center;margin:6px 0 0">${icon('lock', 'width="13" height="13" style="vertical-align:-2px"')} ${esc(t('room_safety'))}</p>
      <form class="composer" id="composer">
        <textarea name="body" rows="1" maxlength="1000" placeholder="${esc(t('room_placeholder'))}" aria-label="${esc(t('room_placeholder'))}" required></textarea>
        <button class="btn" type="submit" aria-label="${esc(t('room_send'))}">${icon('send')}</button>
      </form>
      <div class="chat-spacer"></div>` : ''}`;
};

BINDERS.rooms = function (code) {
  const room = state.room;
  if (!room || !code || room.code !== code.toUpperCase()) return;
  const chat = document.getElementById('chat');
  const atBottom = () => window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 160;
  const toBottom = () => window.scrollTo(0, document.documentElement.scrollHeight);
  if (room.id in (state.rooms || {})) toBottom();
  const last = room.list[room.list.length - 1];
  if (last) markRoomRead(room.id, last.created_at);

  const redraw = () => { chat.innerHTML = chatHTML(room.list); bindDeletes(); };
  const bindDeletes = () => chat.querySelectorAll('[data-del-msg]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.from('messages').update({ deleted: true }).eq('id', b.dataset.delMsg);
    if (error) { b.disabled = false; return toast(errMsg(error), true); }
    const m = room.list.find(x => String(x.id) === b.dataset.delMsg);
    if (m) m.deleted = true;
    redraw();
  });
  bindDeletes();

  const addMessage = async (m) => {
    if (room.list.some(x => x.id === m.id)) return;
    const stick = atBottom() || m.user_id === state.profile.id;
    await loadNames([m.user_id]);
    room.list.push(m);
    room.list.sort((a, b) => a.created_at.localeCompare(b.created_at));
    if (!chat.isConnected) return;
    redraw();
    if (stick) toBottom();
    markRoomRead(room.id, m.created_at);
  };

  // Realtime: 이 방의 새 메시지·삭제.
  //   구독은 방에 있는 동안 하나만 유지하고, 이벤트는 "지금 화면"의 처리기로 보냄
  //   (방 참여 등으로 화면을 다시 그려도 새 메시지가 옛 화면으로 가지 않도록)
  state.roomOnEvent = (payload) => {
    if (state.room !== room || !chat.isConnected) return;
    const m = payload.new;
    if (payload.eventType === 'INSERT' && m?.id) addMessage(m);
    else if (payload.eventType === 'UPDATE' && m?.id) {
      const ex = room.list.find(x => x.id === m.id);
      if (ex) { ex.deleted = m.deleted; redraw(); }
    }
  };
  if (!state.roomSub || state.roomSub.code !== room.code) {
    closeRoomSub();
    const ch = sb.channel('room-' + room.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages', filter: 'country_id=eq.' + room.id }, (payload) => state.roomOnEvent?.(payload))
      .subscribe();
    state.roomSub = { code: room.code, ch };
  }

  const join = document.getElementById('room-join');
  if (join) join.onclick = async () => {
    join.disabled = true;
    const { error } = await sb.from('room_members').insert({ user_id: state.profile.id, country_id: room.id });
    if (error && error.code !== '23505') { join.disabled = false; return toast(errMsg(error), true); }
    toast(t('room_joined_toast', { c: countryName(countryById(room.id)) }));
    render();
  };
  const leave = document.getElementById('room-leave');
  if (leave) leave.onclick = async () => {
    leave.disabled = true;
    const { error } = await sb.from('room_members').delete().eq('user_id', state.profile.id).eq('country_id', room.id);
    if (error) { leave.disabled = false; return toast(errMsg(error), true); }
    toast(t('room_left_toast'));
    render();
  };

  const form = document.getElementById('composer');
  if (!form) return;
  const ta = form.querySelector('textarea');
  const fit = () => { ta.style.height = '44px'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; };
  ta.addEventListener('input', fit);
  ta.addEventListener('keydown', (e) => {
    // 데스크톱: Enter 로 보내기, Shift+Enter 는 줄바꿈 (한글 조합 중에는 보내지 않음)
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer: fine)').matches) { e.preventDefault(); form.requestSubmit(); }
  });
  form.onsubmit = async (e) => {
    e.preventDefault();
    const body = ta.value.trim();
    if (!body) return;
    const btn = form.querySelector('button');
    btn.disabled = true;
    const { data, error } = await sb.from('messages').insert({ country_id: room.id, user_id: state.profile.id, body }).select().single();
    btn.disabled = false;
    if (error) return toast(errMsg(error), true);
    ta.value = ''; fit(); ta.focus();
    addMessage(data);
  };
};

async function viewCommunityRooms() {
  const [list, rooms, counts] = await Promise.all([loadCountries(), loadRooms(), roomMemberCounts()]);
  const active = list.filter(c => c.is_active);
  const mine = active.filter(c => c.id in rooms);
  const others = active.filter(c => !(c.id in rooms));
  const sums = await Promise.all(mine.map(c => roomSummary(c.id, rooms[c.id])));
  await loadNames(sums.map(x => x.last?.user_id).filter(Boolean));
  const mineRows = mine.map((c, i) => {
    const { last, unread } = sums[i];
    const preview = last ? `${last.user_id === state.profile.id ? t('you') : shortName(nameCache[last.user_id]?.name)}: ${last.body}` : membersLabel(counts[c.id] || 0);
    return `<a class="list-row" href="#/rooms/${esc(c.code)}">
      <span class="flag-tile" style="font-size:30px" aria-hidden="true">${flag(c.code)}</span>
      <div class="meta"><div class="t">${esc(countryName(c))}</div><div class="d ellip">${esc(preview)}</div></div>
      ${unread ? `<span class="unread" aria-label="${unread} new">${unread > 99 ? '99+' : unread}</span>` : ''}
      <span class="chev">${icon('chev')}</span></a>`;
  }).join('');
  const otherRows = others.map(c => `<a class="list-row" href="#/rooms/${esc(c.code)}">
      <span class="flag-tile" style="font-size:30px" aria-hidden="true">${flag(c.code)}</span>
      <div class="meta"><div class="t">${esc(countryName(c))}</div><div class="d">${esc(membersLabel(counts[c.id] || 0))}</div></div>
      <span class="tag">${esc(t('rooms_join_short'))}</span><span class="chev">${icon('chev')}</span></a>`).join('');
  return `<div class="section-head" style="margin-top:4px"><h2>${esc(t('rooms_mine'))}</h2></div>
    ${card(mine.length ? mineRows : `<p class="muted small" style="margin:0">${esc(t('rooms_mine_empty'))}</p>`)}
    ${others.length ? `<div class="section-head"><h2>${esc(t('rooms_other'))}</h2></div>${card(otherRows)}` : ''}
    <p class="small muted" style="margin:10px 4px 0">${esc(t('com_rooms_d'))}</p>`;
}

// ⑦ 신청 & 매칭 — 신청서 · 내 신청 타임라인 · 연장 신청
// ---------------------------------------------------------------------
const APP_FLOW = ['submitted', 'approved', 'preparing', 'on_field', 'returned'];
const ACTIVE_STATUSES = ['submitted', 'approved', 'preparing', 'on_field'];
const DURATIONS = { short: ['1m', '2m', '3m', '6m'], mid: ['12m', '24m'], long: ['long'] };
const DUR_MONTHS = { '1m': 1, '2m': 2, '3m': 3, '6m': 6, '12m': 12, '24m': 24 };
function statusTag(s) { return `<span class="st st-${esc(s)}">${esc(t('st_' + s))}</span>`; }
function durLabel(d) { return d ? (i18n[state.lang]['dur_' + d] || i18n.en['dur_' + d] || d) : '—'; }
function fmtDay(dateStr) { return dateStr ? new Date(dateStr + 'T12:00:00').toLocaleDateString(dateLocale(), { year: 'numeric', month: 'short', day: 'numeric' }) : '—'; }
function addMonths(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const x = new Date(Date.UTC(y, m - 1 + n, d));
  return x.toISOString().slice(0, 10);
}
function canApply() { return !(state.settings.require_graduation_to_apply === true) || ['graduate', 'admin'].includes(state.profile.role); }
async function loadMyApps() {
  const { data } = await sb.from('applications').select('*').eq('user_id', state.profile.id).order('created_at', { ascending: false });
  state.myApps = data || [];
  return state.myApps;
}
function appRow(a) {
  const c = countryById(a.country_id);
  return `<a class="list-row" href="#/apps/${a.id}">
    <span class="flag-tile" style="font-size:30px" aria-hidden="true">${c ? flag(c.code) : '🌏'}</span>
    <div class="meta"><div class="t">${esc(c ? countryName(c) : '—')}</div><div class="d">${esc(t('tr_' + a.track))} · ${esc(fmtDay(a.start_date))}</div></div>
    ${statusTag(a.status)}<span class="chev">${icon('chev')}</span></a>`;
}

      <label class="field" style="margin-bottom:8px"><span>${esc(t('ap_track'))}</span></label>
      <div class="choice">${['short', 'mid', 'long'].map((k, i) => `<label><input type="radio" name="track" value="${k}" ${i === 0 ? 'checked' : ''}>
        <span><b>${esc(t('tr_' + k))}</b><span class="d">${esc(t('tr_' + k + '_d'))}</span></span></label>`).join('')}</div>
      <div id="ap-seasons" style="margin:-4px 0 18px"><div class="small muted">${esc(t('seasons'))}</div>${seasonsChips()}</div>
      <div class="field-pair">
        <label class="field"><span>${esc(t('ap_start'))}</span><input type="date" name="start_date" min="${today}" required></label>
        <label class="field"><span>${esc(t('ap_duration'))}</span><select name="duration_text" id="ap-dur"></select></label>
      </div>
      <label class="field"><span>${esc(t('ap_contact'))}</span><input type="text" name="contact" value="${esc(contact)}" autocomplete="tel" required maxlength="200"></label>
      <label class="field"><span>${esc(t('ap_motivation'))}</span><textarea name="motivation" required maxlength="3000" placeholder="${esc(t('ap_motivation_ph'))}"></textarea></label>
      <div class="form-note">${icon('plane')}<span>${esc(t('ap_flight_note'))}</span></div>
      <button class="btn block" type="submit">${esc(t('ap_submit'))}</button>
    </form>`);
};

BINDERS.apply = function () {
  const form = document.getElementById('apply-form');
  if (!form) return;
  const dur = document.getElementById('ap-dur');
  const sync = () => {
    const track = form.track.value;
    const keep = dur.value;
    dur.innerHTML = DURATIONS[track].map(d => `<option value="${d}">${esc(durLabel(d))}</option>`).join('');
    if (DURATIONS[track].includes(keep)) dur.value = keep;
    document.getElementById('ap-seasons').classList.toggle('hidden', track !== 'short');
    const c = countryById(Number(form.country_id.value));
    document.getElementById('ap-sensitive').innerHTML = c?.is_sensitive ? `<div class="form-note">${icon('lock')}<span>${esc(t('ap_sensitive_note'))}</span></div>` : '';
  };
  form.querySelectorAll('[name=track]').forEach(r => r.onchange = sync);
  form.country_id.onchange = sync;
  sync();
  form.onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    if (!f.start_date || !f.contact.trim() || f.motivation.trim().length < 10) return toast(t('ap_need'), true);
    const months = DUR_MONTHS[f.duration_text];
    const row = {
      user_id: state.profile.id, country_id: Number(f.country_id), track: f.track,
      start_date: f.start_date, duration_text: f.duration_text,
      expected_return: months ? addMonths(f.start_date, months) : null,
      contact: f.contact.trim(), motivation: f.motivation.trim(),
    };
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    const { data, error } = await sb.from('applications').insert(row).select().single();
    btn.disabled = false;
    if (error) return toast(errMsg(error), true);
    state.myApps = null;
    toast(t('ap_submitted_toast'));
    location.hash = '#/apps/' + data.id;
  };
};

VIEWS.apps = async function (id) {
  const [, apps] = await Promise.all([loadCountries(), loadMyApps()]);
  if (!id) {
    return `<div style="padding-top:8px"><a href="#/my" class="back-pill">${icon('chevl')}${esc(t('tab_my'))}</a></div>
      ${pageHead(t('apps_title'))}
      ${card(apps.length ? apps.map(appRow).join('') : `<p class="muted" style="margin:0">${esc(t('apps_empty'))}</p>`)}
      <a class="btn block navy" href="#/countries" style="margin-top:4px">${icon('plane')} ${esc(t('apps_new'))}</a>`;
  }
  const back = `<div style="padding-top:8px"><a href="#/apps" class="back-pill">${icon('chevl')}${esc(t('apps_title'))}</a></div>`;
  const a = apps.find(x => String(x.id) === String(id));
  if (!a) return back + `<div style="margin-top:12px">${card(`<h3>${esc(t('not_found'))}</h3>`)}</div>`;
  const c = countryById(a.country_id);
  const [hist, exts] = await Promise.all([
    sb.from('application_status_history').select('status,changed_at').eq('application_id', a.id).order('changed_at'),
    sb.from('application_extensions').select('*').eq('application_id', a.id).order('created_at', { ascending: false }),
  ]);
  const when = {};
  (hist.data || []).forEach(h => { when[h.status] = h.changed_at; });
  const dateOf = s => when[s] ? new Date(when[s]).toLocaleDateString(dateLocale(), { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  let steps;
  if (a.status === 'rejected') {
    steps = `<li class="done"><b>${esc(t('st_submitted'))}</b><span>${esc(dateOf('submitted'))}</span></li>
      <li class="bad"><b>${esc(t('st_rejected'))}</b><span>${esc(dateOf('rejected'))}</span></li>`;
  } else {
    const cur = APP_FLOW.indexOf(a.status);
    steps = APP_FLOW.map((s, i) => `<li class="${i < cur ? 'done' : i === cur ? (s === 'returned' ? 'done' : 'now') : 'todo'}"><b>${esc(t('st_' + s))}</b>${i <= cur ? `<span>${esc(dateOf(s))}</span>` : ''}</li>`).join('');
  }
  const extList = exts.data || [];
  const pending = extList.some(x => x.status === 'pending');
  const minDate = a.expected_return && a.expected_return > nowInTZ().date ? addDays(a.expected_return, 1) : addDays(nowInTZ().date, 1);
  const extCard = card(`<span class="eyebrow plain">${icon('calendar', 'width="14" height="14"')} ${esc(t('ext_title'))}</span>
      <div class="form-note" style="margin-top:12px">${icon('plane')}<span>${esc(t('ext_note'))}</span></div>
      ${a.status !== 'on_field' ? `<p class="small muted" style="margin:0">${esc(t('ext_only_on_field'))}</p>`
        : pending ? `<p class="small" style="margin:0">${esc(t('ext_wait'))}</p>`
        : `<form id="ext-form" novalidate>

// 올리기 전에 긴 변 1600px JPEG 로 줄임 (데이터·로딩 절약)
async function resizeImage(file, max = 1600) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.naturalWidth * scale); cv.height = Math.round(img.naturalHeight * scale);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(img.src);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', 0.85));
}
async function addCountryPhoto(c, file, sortOrder) {
  const blob = await resizeImage(file, DEMO ? 1000 : 1600);
  let url;
  if (DEMO) {
    url = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
  } else {
    const path = `${c.code.toLowerCase()}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
    const { error } = await sb.storage.from('country-photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (error) throw error;
    url = sb.storage.from('country-photos').getPublicUrl(path).data.publicUrl;
  }
  const { error } = await sb.from('country_photos').insert({ country_id: c.id, url, sort_order: sortOrder });

  state.photos = null;

// ③ 교육 — A. 언어 훈련 (복음 메시지 현지어 암기)
//   듣기 → 따라하기 → 가리기 → 자가 테스트. 음성은 녹음(audio_url) 우선, 없으면 브라우저 TTS
//   숙달도: 0 처음 · 1 연습함 · 2 자가 테스트 1번 맞힘 · 3 세 번 이상 맞힘
// ---------------------------------------------------------------------
const TTS_LANG = { KR: 'ko-KR', PH: 'fil-PH', MY: 'ms-MY', TH: 'th-TH', MX: 'es-MX', JP: 'ja-JP', EG: 'ar-EG' };
const LANG_NAME = {
  KR: ['Korean', '한국어'], PH: ['Tagalog', '타갈로그어'], MY: ['Malay', '말레이어'], TH: ['Thai', '태국어'],
  MX: ['Spanish', '스페인어'], JP: ['Japanese', '일본어'], EG: ['Arabic (Egyptian)', '아랍어 (이집트)'],
};
function langName(code) { const n = LANG_NAME[code]; return n ? n[state.lang === 'ko' ? 1 : 0] : code; }
// 뜻: 화면 언어로 보여 주되, 한국어 문장을 한국어로 다시 보여 주지는 않음
function meaning(s, code) {
  const c = code || countryById(s.country_id)?.code;
  return state.lang === 'ko' && c !== 'KR' ? (s.source_ko || s.source_text) : (s.source_text || s.source_ko);
}
function masteryOf(p) {
  if (!p) return 0;
  if (p.correct_count >= 3) return 3;
  if (p.correct_count >= 1) return 2;
  return p.repeat_count > 0 || p.wrong_count > 0 ? 1 : 0;
}
function masteryDots(m) { return `<span class="dots" aria-label="${esc(t('mastery_label'))} ${m}/3">${[1, 2, 3].map(i => `<i class="${i <= m ? 'on' : ''}"></i>`).join('')}</span>`; }

// 훈련할 나라: 직접 고른 나라 → 신청한 나라 → 이름 쓴 나라 → 한국
function trainCountryCode() {
  const active = (state.countries || []).filter(c => c.is_active);
  const ok = code => active.some(c => c.code === code);
  const saved = safeGet('svm_train_country');
  if (saved && ok(saved)) return saved;
  const app = (state.myApps || []).find(a => ACTIVE_STATUSES.includes(a.status));
  const fromApp = app && countryById(app.country_id)?.code;
  if (fromApp && ok(fromApp)) return fromApp;
  const pledged = [...state.myPledges].map(countryById).find(c => c && c.is_active);
  return pledged?.code || active[0]?.code || 'KR';
}

async function loadStreak() {
  const { data } = await sb.from('practice_days').select('day').eq('user_id', state.profile.id).order('day', { ascending: false }).limit(400);
  const days = new Set((data || []).map(r => r.day));
  const today = nowInTZ().date;
  let d = days.has(today) ? today : addDays(today, -1), n = 0;
  while (days.has(d)) { n++; d = addDays(d, -1); }
  return { streak: n, today: days.has(today), total: days.size };
}
// 나라별 통과 여부: 메시지의 모든 문장을 자가 테스트에서 한 번 이상 맞힘
function passedCountries(sentences, progress) {
  const by = {};
  sentences.forEach(s => { (by[s.country_id] ||= []).push(s); });
  return Object.entries(by).filter(([, list]) => list.length && list.every(s => (progress[s.id]?.correct_count || 0) >= 1)).map(([cid]) => Number(cid));
}
// 훈련 요약 (Train 탭·홈·수료 조건 공용)
async function trainSummary() {
  const msgs = await loadGospelMessages();
  const msg = msgs[0] || null;
  const [sentences, progress, streak] = await Promise.all([msg ? loadAllSentences(msg.id) : [], loadMyProgress(), loadStreak()]);
  return { msg, sentences, progress, streak, passed: passedCountries(sentences, progress) };
}

// ---------- 진도 저장 (모아서 저장) ----------
const progressQueue = new Set();
let progressTimer = null, practiceMarked = null;
function bumpProgress(sid, { repeat = 0, correct = 0, wrong = 0 } = {}) {
  const L = state.learn;
  if (!L) return;
  const cur = L.progress[sid] || { user_id: state.profile.id, sentence_id: sid, repeat_count: 0, correct_count: 0, wrong_count: 0, mastery: 0 };
  cur.repeat_count += repeat; cur.correct_count += correct; cur.wrong_count += wrong;
  cur.mastery = masteryOf(cur);
  cur.last_practiced = new Date().toISOString();
  L.progress[sid] = cur;
  progressQueue.add(sid);
  clearTimeout(progressTimer);
  progressTimer = setTimeout(flushProgress, 1500);
  markPracticeDay();
  const dots = document.querySelector(`[data-sent="${sid}"] .dots`);
  if (dots) dots.outerHTML = masteryDots(cur.mastery);
}
async function flushProgress() {
  clearTimeout(progressTimer);
  if (!progressQueue.size || !state.learn) return;
  const rows = [...progressQueue].map(id => {
    const p = state.learn.progress[id];
    return { user_id: state.profile.id, sentence_id: id, repeat_count: p.repeat_count, correct_count: p.correct_count, wrong_count: p.wrong_count, mastery: p.mastery, last_practiced: p.last_practiced };
  });
  progressQueue.clear();
  const { error } = await sb.from('language_progress').upsert(rows, { onConflict: 'user_id,sentence_id' });
  if (error) toast(errMsg(error), true);
}
function markPracticeDay() {
  const today = nowInTZ().date;
  if (practiceMarked === today) return;
  practiceMarked = today;
  sb.from('practice_days').upsert({ user_id: state.profile.id, day: today }, { onConflict: 'user_id,day', ignoreDuplicates: true }).then(() => {});
}
window.addEventListener('pagehide', () => { flushProgress(); });

const player = { token: 0, playing: false, audio: null };
function voiceFor(lang) {
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices();
  const base = lang.split('-')[0];
  return vs.find(v => v.lang.replace('_', '-').toLowerCase() === lang.toLowerCase())
    || vs.find(v => v.lang.toLowerCase().startsWith(base + '-') || v.lang.toLowerCase() === base)
    || (base === 'fil' ? vs.find(v => v.lang.toLowerCase().startsWith('tl')) : null) || null;
}
function speakOnce(s, code, rate) {
  return new Promise(resolve => {
    const done = () => { clearTimeout(guard); resolve(); };
    // 소리가 안 나는 환경에서도 멈추지 않도록 시간 제한
    const guard = setTimeout(resolve, Math.max(2500, (s.local_text || '').length * 160 / rate));
    if (s.audio_url) {
      const a = new Audio(s.audio_url);
      a.playbackRate = rate; player.audio = a;
      a.onended = done; a.onerror = done;
      a.play().catch(done);
      return;
    }
    if (!('speechSynthesis' in window) || !s.local_text) return;
    const u = new SpeechSynthesisUtterance(s.local_text);
    u.lang = TTS_LANG[code] || 'en-US';
    const v = voiceFor(u.lang); if (v) u.voice = v;
    u.rate = rate;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  });
}
function stopAudio() {
  player.token++; player.playing = false;
  try { speechSynthesis.cancel(); } catch (e) {}
  if (player.audio) { player.audio.pause(); player.audio = null; }
  document.querySelectorAll('.sent.playing').forEach(el => el.classList.remove('playing'));
  const b = document.getElementById('play-all');
  if (b) b.innerHTML = `${icon('play')} ${esc(t('play_all'))}`;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function playSequence(startIdx = 0) {
  const L = state.learn;
  stopAudio();
  const my = ++player.token;
  player.playing = true;
  const b = document.getElementById('play-all');
  if (b) b.innerHTML = `${icon('stop')} ${esc(t('stop'))}`;
  const times = L.mode === 'shadow' ? L.times : 1;
  do {
    for (let i = startIdx; i < L.sentences.length; i++) {
      for (let k = 0; k < times; k++) {
        if (my !== player.token) return;
        const s = L.sentences[i];
        document.querySelectorAll('.sent.playing').forEach(el => el.classList.remove('playing'));
        const el = document.querySelector(`[data-sent="${s.id}"]`);
        if (el) { el.classList.add('playing'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
        await speakOnce(s, L.code, L.rate);
        if (my !== player.token) return;
        bumpProgress(s.id, { repeat: 1 });
        // 따라하기: 들은 만큼 따라 말할 시간 + 설정한 쉬는 시간
        await wait(L.gap * 1000 + (L.mode === 'shadow' ? Math.min(6000, (s.local_text || '').length * 90) : 0));
      }
    }
    startIdx = 0;
  } while (L.loop && my === player.token);
  if (my === player.token) stopAudio();
}

function maskText(text, level, code) {
  if (level === 'none') return esc(text);
  if (level === 'all') return `<span class="mask">${esc(text.replace(/[^\s.,!?¿¡。、？！]/g, '•'))}</span>`;
  // 반 가리기: 띄어쓰기가 있는 언어는 단어, 없는 언어(태국어·일본어)는 두 글자씩
  const parts = /\s/.test(text.trim()) && code !== 'JP' && code !== 'TH' ? text.split(/(\s+)/) : text.match(/.{1,2}/gu) || [];
  let k = 0;
  return parts.map(p => (/^\s+$/.test(p) ? p : (k++ % 2 ? `<span class="mask">${esc(p.replace(/./gu, '•'))}</span>` : esc(p)))).join('');
}
function sentenceHTML(s, i) {
  const L = state.learn;
  const m = masteryOf(L.progress[s.id]);
  const hide = L.mode === 'hide' && !L.revealed.has(s.id) ? L.hideLevel : 'none';

      <div class="sent-top"><span class="n">${i + 1}</span>${masteryDots(m)}
        <button type="button" class="play-one" data-play="${i}" aria-label="${esc(t('play_all'))} ${i + 1}">${icon('speaker')}</button></div>
      <div class="local" lang="${esc((TTS_LANG[L.code] || 'en').split('-')[0])}" ${L.code === 'EG' ? 'dir="rtl"' : ''}>${maskText(s.local_text || '', hide, L.code)}</div>
      ${s.pronunciation ? `<div class="pron">${hide === 'all' ? '' : esc(s.pronunciation)}</div>` : ''}
      <div class="mean">${esc(meaning(s))}</div>
    </div>`;
}

    <div class="q-label">${esc(t('test_say', { l: langName(L.code) }))}</div>

    ${T.shown ? `<div class="answer">

    : `<button class="btn block navy" id="test-show" style="margin-top:22px">${esc(t('test_show'))}</button>`}

function learnBodyHTML() {

        <label class="ctl">${esc(t('gap'))}<select id="gap">${[1, 2, 4].map(g => `<option value="${g}" ${L.gap === g ? 'selected' : ''}>${g}s</option>`).join('')}</select></label>

BINDERS.learn = function () {
  const L = state.learn;
  if (!L || !L.sentences.length) return;
  const body = document.getElementById('learn-body');
  const redraw = () => { body.innerHTML = learnBodyHTML(); bindBody(); };
  const bindBody = () => {
    body.querySelectorAll('[data-play]').forEach(b => b.onclick = async (e) => {
      e.stopPropagation();
      stopAudio();
      const s = L.sentences[Number(b.dataset.play)];
      const my = ++player.token;
      document.querySelector(`[data-sent="${s.id}"]`)?.classList.add('playing');
      await speakOnce(s, L.code, L.rate);
      if (my === player.token) { bumpProgress(s.id, { repeat: 1 }); document.querySelector(`[data-sent="${s.id}"]`)?.classList.remove('playing'); }
    });
    const pa = document.getElementById('play-all');
    if (pa) pa.onclick = () => (player.playing ? stopAudio() : playSequence(0));
    const loop = document.getElementById('loop'); if (loop) loop.onchange = () => { L.loop = loop.checked; };
    const rate = document.getElementById('rate'); if (rate) rate.onchange = () => { L.rate = Number(rate.value); };
    const gap = document.getElementById('gap'); if (gap) gap.onchange = () => { L.gap = Number(gap.value); };
    const times = document.getElementById('times'); if (times) times.onchange = () => { L.times = Number(times.value); };
    body.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => { L.hideLevel = b.dataset.hide; L.revealed.clear(); redraw(); });
    if (L.mode === 'hide') body.querySelectorAll('.sent').forEach(el => {
      const toggle = () => {
        const s = L.sentences[Number(el.dataset.i)];
        if (L.revealed.has(s.id)) L.revealed.delete(s.id); else { L.revealed.add(s.id); bumpProgress(s.id, { repeat: 1 }); }
        el.outerHTML = sentenceHTML(s, Number(el.dataset.i)); bindBody();
      };
      el.onclick = toggle;
      el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
    });
    const T = L.test;
    const show = document.getElementById('test-show');
    if (show) show.onclick = () => { T.shown = true; redraw(); speakOnce(L.sentences[T.idx], L.code, L.rate); };
    const grade = ok => {
      const s = L.sentences[T.idx];
      bumpProgress(s.id, ok ? { correct: 1 } : { wrong: 1 });
      T.results.push(ok); T.idx++; T.shown = false; redraw();
      if (T.idx >= L.sentences.length) flushProgress();
    };
    const right = document.getElementById('test-right'); if (right) right.onclick = () => grade(true);
    const wrong = document.getElementById('test-wrong'); if (wrong) wrong.onclick = () => grade(false);
    const again = document.getElementById('test-again'); if (again) again.onclick = () => { L.test = { idx: 0, shown: false, results: [] }; redraw(); };
  };
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    stopAudio();
    L.mode = b.dataset.mode;
    L.revealed.clear();
    if (L.mode === 'test') L.test = { idx: 0, shown: false, results: [] };
    app.querySelectorAll('[data-mode]').forEach(x => { x.classList.toggle('active', x === b); x.setAttribute('aria-selected', String(x === b)); });
    document.getElementById('mode-desc').textContent = t('mode_' + L.mode + '_d');
    redraw();
  });
  const pick = document.getElementById('msg-pick');
  if (pick) pick.onchange = () => { stopAudio(); L.msgId = Number(pick.value); render(); };
  bindBody();
  // 이 기기에 해당 언어 음성이 없으면 안내 (음성 목록은 늦게 로드될 수 있음)
  const note = document.getElementById('tts-note');
  const check = () => { if (note && !voiceFor(TTS_LANG[L.code])) note.textContent = t('tts_none', { l: langName(L.code) }); };
  if (note) { check(); try { speechSynthesis.addEventListener('voiceschanged', check, { once: true }); } catch (e) {} }
};

function ytId(url) { const m = /(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/.exec(url || ''); return m ? m[1] : null; }

function bindAdminTraining() {
  const T = state.adminTrain;
  bindAudioTools();
  const armed = (b, fn) => () => {
    // 두 번 눌러 삭제
    if (!b.dataset.armed) { b.dataset.armed = '1'; const old = b.textContent; b.textContent = t('adm_tap_twice'); setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = old; } }, 3000); return; }
    fn();
  };
  const done = (error, msgKey = 'saved') => { if (error) return toast(errMsg(error), true); toast(t(msgKey)); render(); };
  app.querySelectorAll('[data-grad]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.from('graduation_requests').update({ status: b.dataset.gradTo }).eq('id', b.dataset.grad);
    state.adminMembers = null;
    done(error, 'adm_updated');
  });
  app.querySelectorAll('[data-fb-form]').forEach(f => f.onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.from('course_feedback').update({ admin_comment: f.admin_comment.value.trim() || null }).eq('id', f.dataset.fbForm);
    done(error);
  });
  app.querySelectorAll('[data-course-form]').forEach(f => f.onsubmit = async (e) => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(f));
    const row = { title_en: v.title_en.trim(), title_ko: v.title_ko.trim() || null, video_url: v.video_url.trim() || null,
      description: v.description.trim() || null, description_ko: v.description_ko.trim() || null,
      sort_order: Number(v.sort_order) || 0, required: !!v.required };
    if (!row.title_en) return;
    const id = f.dataset.courseForm;
    const { error } = id === 'new' ? await sb.from('courses').insert(row) : await sb.from('courses').update(row).eq('id', id);
    done(error);
  });
  app.querySelectorAll('[data-course-del]').forEach(b => b.onclick = armed(b, async () => {
    const { error } = await sb.from('courses').delete().eq('id', b.dataset.courseDel);
    done(error, 'adm_deleted');
  }));
  app.querySelectorAll('[data-gospel-country]').forEach(b => b.onclick = () => { state.adminGospelCountry = b.dataset.gospelCountry; render(); });
  app.querySelectorAll('[data-sent-form]').forEach(f => f.onsubmit = async (e) => {
    e.preventDefault();
    if (!T.msg || !T.gcountry) return;
    const v = Object.fromEntries(new FormData(f));
    const row = { source_text: v.source_text.trim(), source_ko: v.source_ko.trim() || null, local_text: v.local_text.trim() || null, pronunciation: v.pronunciation.trim() || null };
    if (!row.source_text) return;
    const id = f.dataset.sentForm;
    let error;
    if (id === 'new') {
      const seq = Math.max(0, ...T.sentences.filter(s => s.country_id === T.gcountry.id).map(s => s.seq)) + 1;
      ({ error } = await sb.from('gospel_sentences').insert({ ...row, message_id: T.msg.id, country_id: T.gcountry.id, seq }));
    } else ({ error } = await sb.from('gospel_sentences').update(row).eq('id', id));
    done(error);
  });
  app.querySelectorAll('[data-sent-del]').forEach(b => b.onclick = armed(b, async () => {
    const { error } = await sb.from('gospel_sentences').delete().eq('id', b.dataset.sentDel);
    done(error, 'adm_deleted');
  }));
}

function backLink(href, label) { return `<div style="padding-top:8px"><a href="${href}" class="back-pill">${icon('chevl')}${esc(label)}</a></div>`; }
function relTime(iso) {
  const d = new Date(iso), mins = Math.round((Date.now() - d) / 60000);
  if (mins < 1) return state.lang === 'ko' ? '방금' : 'just now';
  if (mins < 60) return state.lang === 'ko' ? `${mins}분 전` : `${mins}m ago`;
  if (mins < 60 * 24) return state.lang === 'ko' ? `${Math.round(mins / 60)}시간 전` : `${Math.round(mins / 60)}h ago`;
  return d.toLocaleDateString(dateLocale(), { month: 'short', day: 'numeric' });
}
function countryOptions(selected, { blank = true } = {}) {
  return (blank ? `<option value="">${esc(t('no_country'))}</option>` : '')
    + (state.countries || []).filter(c => c.is_active).map(c => `<option value="${c.id}" ${String(selected) === String(c.id) ? 'selected' : ''}>${flag(c.code)} ${esc(countryName(c))}</option>`).join('');
}
// 두 번 눌러 확인 (브라우저 confirm 대신)
function armTwice(b, fn) {
  return () => {
    if (!b.dataset.armed) {
      b.dataset.armed = '1'; const old = b.innerHTML; b.textContent = t('adm_tap_twice');
      setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.innerHTML = old; } }, 3000);
      return;
    }
    fn();
  };
}
async function uploadMemberPhoto(file) {
  const blob = await resizeImage(file, DEMO ? 900 : 1400);
  if (DEMO) return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
  const path = `${state.profile.id}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
  const { error } = await sb.storage.from('testimony-photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (error) throw error;
  return sb.storage.from('testimony-photos').getPublicUrl(path).data.publicUrl;
}

// ---------------------------------------------------------------------
// 기본 제목(영어)은 화면 언어로 보여 줌
function gTitle(g) { return !g?.title || g.title === 'Sunday Mission Gathering' ? t('g_sunday') : g.title; }
function checkInOpen(g) {
  const now = nowInTZ();
  if (!g || g.date !== now.date) return false;
  const toMin = hhmm => { const [h, m] = hhmm.slice(0, 5).split(':').map(Number); return h * 60 + m; };
  const n = toMin(now.time);
  return n >= toMin(g.start_time) - 30 && n <= toMin(g.end_time) + 30;
}
async function myAttendance() {
  const { data } = await sb.from('attendance').select('gathering_id,checked_at').eq('user_id', state.profile.id);
  return new Set((data || []).map(r => r.gathering_id));
}
async function checkIn() {
  const { error } = await sb.rpc('self_check_in');
  if (error) return toast(errMsg(error), true);
  toast(t('checked_in'));
  render();
}
async function pastGatherings(limit = 16) {
  const { data } = await sb.from('gatherings').select('*').lte('date', nowInTZ().date).order('date', { ascending: false }).limit(limit);
  return data || [];
}
function attendanceStats(gs, mine) {
  const today = nowInTZ().date;
  // 오늘 모임이 아직 진행 중이고 체크인 전이면 연속 기록에서 빼고 계산
  const list = gs.filter(g => !(g.date === today && !mine.has(g.id)));
  let streak = 0;
  for (const g of list) { if (mine.has(g.id)) streak++; else break; }
  return { total: gs.filter(g => mine.has(g.id)).length, streak };
}

BINDERS.testimonies = function (param) {
  app.querySelectorAll('[data-new-testi]').forEach(a => a.addEventListener('click', () => { state.newTestimonyPrayer = null; }));
  app.querySelectorAll('[data-del-testi]').forEach(b => b.onclick = armTwice(b, async () => {
    const { error } = await sb.from('testimonies').delete().eq('id', b.dataset.delTesti);
    if (error) return toast(errMsg(error), true);
    toast(t('adm_deleted')); render();
  }));
  const form = document.getElementById('testi-form');
  if (!form) return;
  const files = [];
  const photoBox = document.getElementById('testi-photos');
  const drawPhotos = () => {
    const c = countryById(Number(form.country_id.value));
    const blocked = c?.is_sensitive && state.settings.sensitive_photo_block === true;
    if (blocked) files.length = 0;
    photoBox.innerHTML = blocked ? `<div class="form-note">${icon('lock')}<span>${esc(t('testi_photo_blocked'))}</span></div>`
      : `<div class="small muted" style="margin:0 0 8px 4px">${esc(t('testi_photos'))}</div>
        <div class="gallery">${files.map((f, i) => `<figure><img src="${esc(f.preview)}" alt=""><button type="button" data-rm-photo="${i}" aria-label="${esc(t('gal_remove'))}">${icon('trash')}</button></figure>`).join('')}
          ${files.length < 3 ? `<label class="gallery-add">${icon('plus')}<span>${esc(t('gal_add'))}</span><input type="file" accept="image/*" id="testi-file"></label>` : ''}</div>`;
    const input = document.getElementById('testi-file');
    if (input) input.onchange = () => { const f = input.files[0]; if (f) { files.push({ file: f, preview: URL.createObjectURL(f) }); drawPhotos(); } };
    photoBox.querySelectorAll('[data-rm-photo]').forEach(b => b.onclick = () => { files.splice(Number(b.dataset.rmPhoto), 1); drawPhotos(); });
  };
  form.country_id.onchange = drawPhotos;
  drawPhotos();
  form.onsubmit = async (e) => {
    e.preventDefault();
    const title = form.title.value.trim(), body = form.body.value.trim();
    if (!title || body.length < 20) return toast(t('testi_need'), true);
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      if (files.length) toast(t('gal_uploading'));
      const photos = [];
      for (const f of files) photos.push(await uploadMemberPhoto(f.file));
      const row = { user_id: state.profile.id, country_id: form.country_id.value ? Number(form.country_id.value) : null, title, body, photos, prayer_id: state.newTestimonyPrayer?.id || null };
      const { error } = await sb.from('testimonies').insert(row);
      if (error) throw error;
      state.newTestimonyPrayer = null;
      toast(t('testi_sent'));
      location.hash = '#/testimonies';
    } catch (err) { toast(errMsg(err), true); btn.disabled = false; }
  };
};

async function loadChecklist() {
  const apps = state.myApps || await loadMyApps();
  const app0 = apps.find(a => ACTIVE_STATUSES.includes(a.status));
  const [{ data: items }, { data: prog }] = await Promise.all([
    sb.from('checklist_items').select('*').order('sort_order').order('id'),
    sb.from('checklist_progress').select('item_id,checked').eq('user_id', state.profile.id),
  ]);
  const list = (items || []).filter(i => i.country_id == null || (app0 && i.country_id === app0.country_id));
  const done = new Set((prog || []).filter(p => p.checked).map(p => p.item_id));
  return { list, done, country: app0 ? countryById(app0.country_id) : null };
}

const pad2 = n => String(n).padStart(2, '0');
function tzParts(date) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG.TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(date).map(x => [x.type, Number(x.value)]));
  return p;
}
function localToISO(local) {   // 'YYYY-MM-DDTHH:MM' (현지 시각) → UTC ISO
  const [d, tm = '00:00'] = local.split('T');
  const [y, m, dd] = d.split('-').map(Number), [h, mi] = tm.split(':').map(Number);
  const want = Date.UTC(y, m - 1, dd, h, mi);
  let guess = want;
  for (let i = 0; i < 3; i++) { const p = tzParts(new Date(guess)); guess += want - Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute); }
  return new Date(guess).toISOString();
}
function isoToLocal(iso) { if (!iso) return ''; const p = tzParts(new Date(iso)); return `${p.year}-${pad2(p.month)}-${pad2(p.day)}T${pad2(p.hour)}:${pad2(p.minute)}`; }

async function saveSentenceAudio(sid, blob) {
  const T = state.adminTrain;
  const s = T.sentences.find(x => String(x.id) === String(sid));
  if (!s) return;
  if (blob.size > 8 * 1024 * 1024) return toast(t('au_too_big'), true);
  toast(t('gal_uploading'));
  let url;
  try {
    if (DEMO) {
      url = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
    } else {
      const ext = (blob.type.split('/')[1] || 'webm').split(';')[0].replace('mpeg', 'mp3');
      const path = `gospel/${T.gcountry.code.toLowerCase()}/${s.id}-${Date.now()}.${ext}`;
      const { error } = await sb.storage.from('audio').upload(path, blob, { contentType: blob.type || 'audio/webm', upsert: false });
      if (error) throw error;
      url = sb.storage.from('audio').getPublicUrl(path).data.publicUrl;
    }
    const old = s.audio_url;
    const { error } = await sb.from('gospel_sentences').update({ audio_url: url }).eq('id', s.id);
    if (error) throw error;
    const m = !DEMO && old && /\/audio\/(.+)$/.exec(old);
    if (m) sb.storage.from('audio').remove([decodeURIComponent(m[1])]).then(() => {});
    toast(t('au_saved')); render();
  } catch (e) { toast(errMsg(e), true); }
}
function bindAudioTools() {
  app.querySelectorAll('[data-rec]').forEach(b => b.onclick = async () => {
    // 녹음 중이면 멈추고 저장
    if (rec.mr && rec.sid === b.dataset.rec) { rec.mr.stop(); return; }
    if (rec.mr) return toast(t('au_busy'), true);
    try {
      rec.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) { return toast(t('au_mic'), true); }
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(x => MediaRecorder.isTypeSupported?.(x)) || '';
    rec.mr = new MediaRecorder(rec.stream, type ? { mimeType: type } : undefined);
    rec.chunks = []; rec.sid = b.dataset.rec;
    rec.mr.ondataavailable = ev => { if (ev.data.size) rec.chunks.push(ev.data); };
    rec.mr.onstop = () => {
      rec.stream.getTracks().forEach(tr => tr.stop());
      if (rec.cancel) { rec.cancel = false; rec.mr = null; rec.sid = null; return; }
      const blob = new Blob(rec.chunks, { type: rec.mr.mimeType || 'audio/webm' });
      const sid = rec.sid; rec.mr = null; rec.sid = null;
      saveSentenceAudio(sid, blob);
    };
    rec.mr.start();
    b.classList.replace('light', 'danger');
    b.innerHTML = `${icon('stop')} ${esc(t('au_stop'))}`;
  });
  app.querySelectorAll('[data-audio-file]').forEach(inp => inp.onchange = () => { const f = inp.files[0]; if (f) saveSentenceAudio(inp.dataset.audioFile, f); });
  app.querySelectorAll('[data-audio-rm]').forEach(b => b.onclick = armTwice(b, async () => {
    const s = state.adminTrain.sentences.find(x => String(x.id) === b.dataset.audioRm);
    const { error } = await sb.from('gospel_sentences').update({ audio_url: null }).eq('id', b.dataset.audioRm);
    if (error) return toast(errMsg(error), true);
    const m = !DEMO && s?.audio_url && /\/audio\/(.+)$/.exec(s.audio_url);
    if (m) sb.storage.from('audio').remove([decodeURIComponent(m[1])]).then(() => {});
    toast(t('adm_deleted')); render();
  }));
}

async function refreshBadges() {
  if (!state.profile) return;
  const me = state.profile.id;
  const [nq, rooms] = await Promise.all([
    sb.from('notifications').select('id', { count: 'exact', head: true }).eq('user_id', me).is('read_at', null),
    sb.from('room_members').select('country_id,last_read_at').eq('user_id', me),
  ]);
  state.notifUnread = nq.count || 0;
  // 안 읽은 채팅: 참여한 방들의 마지막 읽은 시각 이후 메시지 (두 번의 조회로 계산)
  const rs = rooms.data || [];
  let chat = 0;
  if (rs.length) {
    const since = rs.map(r => r.last_read_at).sort()[0];
    const { data } = await sb.from('messages').select('country_id,created_at').in('country_id', rs.map(r => r.country_id))
      .gt('created_at', since).neq('user_id', me).eq('deleted', false).limit(500);
    const last = Object.fromEntries(rs.map(r => [r.country_id, r.last_read_at]));
    chat = (data || []).filter(m => m.created_at > last[m.country_id]).length;
  }
  state.chatUnread = chat;
  paintBadges();
}

  // 열어 보면 모두 읽음으로
  if (!(state.notifList || []).some(n => !n.read_at)) return;
  sb.from('notifications').update({ read_at: new Date().toISOString() }).eq('user_id', state.profile.id).is('read_at', null)
    .then(() => { state.notifUnread = 0; paintBadges(); });
};

// ---------------------------------------------------------------------
// 관리자 첫 화면 — 처리할 일 요약 (탭 배지 겸용)
// ---------------------------------------------------------------------
async function loadAdminTodo() {
  const c = (table, col, val) => sb.from(table).select('id', { count: 'exact', head: true }).eq(col, val);
  const [apps, ext, grad, testi, sup] = await Promise.all([
    c('applications', 'status', 'submitted'), c('application_extensions', 'status', 'pending'), c('graduation_requests', 'status', 'pending'),
    c('testimonies', 'status', 'pending'), c('support_stories', 'status', 'pending'),
  ]);
  state.adminTodo = { apps: apps.count || 0, ext: ext.count || 0, grad: grad.count || 0, testi: testi.count || 0, sup: sup.count || 0 };
  return state.adminTodo;
}
function adminTodoHTML(td) {
  const items = [
    ['apps', 'applications', 'submitted', 'plane', 'todo_apps'], ['ext', 'applications', 'ext', 'calendar', 'todo_ext'],
    ['grad', 'training', null, 'cap', 'todo_grad'], ['testi', 'posts', null, 'spark', 'todo_testi'], ['sup', 'posts', null, 'gift', 'todo_sup'],
  ].filter(([k]) => td[k] > 0);
  if (!items.length) return `<div class="todo-none">${icon('check')} ${esc(t('todo_none'))}</div>`;
  return `<div class="todo">${items.map(([k, tab, filter, ic, label]) => `<button type="button" class="todo-item" data-todo-tab="${tab}" ${filter ? `data-todo-filter="${filter}"` : ''}>
      <span class="ico-tile orange">${icon(ic)}</span><span class="num">${td[k]}</span><span class="lbl">${esc(t(label))}</span></button>`).join('')}</div>`;
}
function adminTabBadge(k) {
  const td = state.adminTodo || {};
  const n = k === 'applications' ? (td.apps || 0) + (td.ext || 0) : k === 'training' ? td.grad || 0 : k === 'posts' ? (td.testi || 0) + (td.sup || 0) : 0;
  return n ? `<span class="tab-n">${n}</span>` : '';
}

// ---------------------------------------------------------------------
// 7) 시작
// ---------------------------------------------------------------------
async function onSession(session) {
  const prevUser = state.session?.user?.id;
  state.session = session;
  if (!session) {
    state.profile = null; state.adminMembers = null; state.countries = null;
    state.myPledges = new Set(); state.pledgeCounts = {}; state.photos = null; state.events = null;
    closeRoomSub(); unsubscribeNotifications(); state.rooms = null; state.room = null; state.myApps = null; state.app = null; state.adminApps = null;
    if (prevUser && state.authMode !== 'recovery') state.authMode = 'login';   // 로그아웃 후에는 로그인 화면 (첫 방문은 회원가입 그대로)
    delete app.dataset.tab;
    render();
    return;
  }
  safeSet('svm_returning', '1');
  if (prevUser !== session.user.id || !state.profile) {
    render();   // 로더 표시
    await Promise.all([loadProfile(), loadSettings()]);
    subscribeNotifications();
    badgeTimer = 0;
  }
  render();
}

function init() {
  document.documentElement.lang = state.lang;
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { state.authMode = 'recovery'; state.session = session; render(); return; }
    if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') { state.session = session; return; }
    if (event === 'SIGNED_IN' && state.session?.user?.id === session?.user?.id && state.profile) return;
    // INITIAL_SESSION / SIGNED_IN / SIGNED_OUT
    // 콜백 안에서 Supabase 호출 시 데드락 방지 — 다음 틱에 처리
    setTimeout(() => onSession(session), 0);
  });
}

window.addEventListener('hashchange', () => { if (state.session && state.profile) render(); window.scrollTo(0, 0); });
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); state.installPrompt = e; document.getElementById('install-btn')?.classList.remove('hidden'); });
window.addEventListener('offline', () => toast(t('offline'), true));

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

init();
</script>
